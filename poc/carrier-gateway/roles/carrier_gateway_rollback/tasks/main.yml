---
- name: Require exact carrier rollback acknowledgement
  ansible.builtin.assert:
    that:
      - >-
        carrier_gateway_rollback_acknowledgement ==
        'ROLLBACK_CARRIER_GATEWAY_TO_PROTECTED_PREVIOUS_CONFIG'
    fail_msg: Refusing carrier rollback without its exact acknowledgement.

- name: Reconcile and burn billable-call authority before any rollback action
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-authority-broker
      - --authorization-root
      - "{{ carrier_gateway_state_root }}/authorization"
      - reconcile
      - --reason
      - pre-rollback
  changed_when: false
  no_log: true

- name: Observe certificate timer and service load state before rollback quiescence
  ansible.builtin.command:
    argv: [systemctl, show, --property=LoadState, --value, "{{ item }}"]
  loop:
    - vivolution-carrier-certificate.timer
    - vivolution-carrier-certificate.service
  register: carrier_gateway_rollback_certificate_load_state
  changed_when: false
  failed_when: >-
    carrier_gateway_rollback_certificate_load_state.rc != 0 or
    carrier_gateway_rollback_certificate_load_state.stdout | trim not in ['loaded', 'not-found']

- name: Gate certificate work before rollback quiescence
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
      - begin
      - --purpose
      - configuration-rollback
  register: carrier_gateway_rollback_certificate_gate
  changed_when: >-
    carrier_gateway_rollback_certificate_gate.stdout | trim ==
    'CARRIER_CERTIFICATE_MAINTENANCE_GATED'

- name: Stop certificate renewal scheduling before rollback state inspection
  ansible.builtin.systemd_service:
    name: vivolution-carrier-certificate.timer
    state: stopped
  when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

- name: Stop any in-progress certificate rotation before rollback
  ansible.builtin.systemd_service:
    name: vivolution-carrier-certificate.service
    state: stopped
  when: carrier_gateway_rollback_certificate_load_state.results[1].stdout | trim == 'loaded'

- name: Prove certificate timer and service are stably inactive
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --value, "{{ item }}"]
  loop:
    - vivolution-carrier-certificate.timer
    - vivolution-carrier-certificate.service
  register: carrier_gateway_rollback_certificate_active_state
  changed_when: false
  failed_when: >-
    carrier_gateway_rollback_certificate_active_state.rc != 0 or
    carrier_gateway_rollback_certificate_active_state.stdout | trim not in ['inactive', 'failed']

- name: Prove renewal and rotation locks are quiescent behind the gate
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
      - assert-locks-quiescent
      - --purpose
      - configuration-rollback
  register: carrier_gateway_rollback_certificate_locks
  retries: 5
  delay: 1
  until: carrier_gateway_rollback_certificate_locks is succeeded
  changed_when: false

- name: Inspect the stable certificate rotation journal boundary
  ansible.builtin.stat:
    path: /var/lib/vivolution-carrier-certificate/rotation/transaction.json
    follow: false
  register: carrier_gateway_rollback_certificate_transaction
  changed_when: false

- name: Release the gate only to recover an unresolved certificate rotation
  when: carrier_gateway_rollback_certificate_transaction.stat.exists | default(false)
  block:
    - name: Release rollback gate for certificate recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - release-for-recovery
          - --purpose
          - configuration-rollback
      changed_when: true

    - name: Restart certificate scheduling for activation recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-certificate.timer
        enabled: true
        state: started
      when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

    - name: Refuse rollback across an unresolved certificate rotation
      ansible.builtin.fail:
        msg: Recover certificate rotation with renew-certificate.yml, then rerun rollback.

- name: Bind the exact live PKI before any configuration rollback mutation
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
      - snapshot-pki
      - --purpose
      - configuration-rollback
  register: carrier_gateway_pre_rollback_pki_snapshot
  changed_when: false
  no_log: true

- name: Inspect an interrupted rollback recovery transaction
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  register: carrier_gateway_recovery_transaction
  changed_when: false

- name: Remove a pre-journal orphan recovery pair before any new transaction
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  when:
    - not (carrier_gateway_recovery_transaction.results[0].stat.exists | default(false))
    - >-
      (carrier_gateway_recovery_transaction.results[1].stat.exists | default(false)) or
      (carrier_gateway_recovery_transaction.results[2].stat.exists | default(false))
  no_log: true

- name: Read the exact interrupted rollback phase
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - transaction-show
      - --journal
      - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
  when: carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)
  register: carrier_gateway_interrupted_rollback_phase
  changed_when: false

- name: Read the exact interrupted rollback target binding
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - transaction-target
      - --journal
      - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
  when: carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)
  register: carrier_gateway_interrupted_rollback_target
  changed_when: false

- name: Finish cleanup for a durably committed interrupted rollback
  when:
    - carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)
    - >-
      carrier_gateway_interrupted_rollback_phase.stdout | trim in
      ['TARGET_COMMITTED', 'RECOVERY_COMMITTED']
  block:
    - name: Remove committed recovery residue without repeating a restore
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
        - "{{ carrier_gateway_state_root }}/rollback/staging"
        - "{{ carrier_gateway_state_root }}/rollback/failed-current"
      no_log: true

    - name: Remove the digest-bound target consumed by a committed target restore
      ansible.builtin.file:
        path: "{{ carrier_gateway_state_root }}/rollback/{{ carrier_gateway_interrupted_rollback_target.stdout | trim }}{{ item }}"
        state: absent
      loop:
        - .tar
        - .tar.sha256
      when: carrier_gateway_interrupted_rollback_phase.stdout | trim == 'TARGET_COMMITTED'
      no_log: true

    - name: Release certificate gate after committed rollback cleanup recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - end
          - --purpose
          - configuration-rollback
      changed_when: true

    - name: Restart certificate scheduling after committed rollback cleanup recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-certificate.timer
        enabled: true
        state: started
      when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

    - name: Finalize the durably committed rollback only after residue cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-finalize
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - "{{ carrier_gateway_interrupted_rollback_phase.stdout | trim }}"
      changed_when: true

    - name: Stop after completing interrupted committed rollback cleanup
      ansible.builtin.fail:
        msg: >-
          Durably committed rollback cleanup was resumed without repeating a
          restore; rerun rollback only to request a new transaction.

- name: Abort only a pre-mutation interrupted preparation phase
  when:
    - carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)
    - carrier_gateway_interrupted_rollback_phase.stdout | trim == 'PREPARING_PRE_ROLLBACK_LKG'
  block:
    - name: Commit preparation abort by removing its journal first
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-abort
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - PREPARING_PRE_ROLLBACK_LKG
      changed_when: true

    - name: Remove partial pre-mutation recovery residue after journal abort
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
      no_log: true

    - name: Prove preparation recovery preserved the exact live PKI
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - snapshot-pki
          - --purpose
          - configuration-rollback
      register: carrier_gateway_preparation_recovery_pki_snapshot
      changed_when: false
      no_log: true

    - name: Require preparation recovery PKI digest equality
      ansible.builtin.assert:
        that:
          - >-
            carrier_gateway_preparation_recovery_pki_snapshot.stdout ==
            carrier_gateway_pre_rollback_pki_snapshot.stdout
        fail_msg: Configuration rollback preparation changed the live PKI.
        quiet: true
      no_log: true

    - name: Release certificate gate after safe preparation recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - end
          - --purpose
          - configuration-rollback
      changed_when: true

    - name: Restart certificate scheduling after preparation recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-certificate.timer
        enabled: true
        state: started
      when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

    - name: Stop after pre-mutation rollback preparation recovery
      ansible.builtin.fail:
        msg: Interrupted pre-mutation rollback preparation was aborted safely; rerun rollback.

- name: Require an interrupted transaction to have its complete recovery pair
  ansible.builtin.assert:
    that:
      - >-
        not (carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)) or
        carrier_gateway_interrupted_rollback_phase.stdout | trim == 'PREPARING_PRE_ROLLBACK_LKG' or
        ((carrier_gateway_recovery_transaction.results[1].stat.isreg | default(false)) and
         (carrier_gateway_recovery_transaction.results[2].stat.isreg | default(false)))
    fail_msg: Rollback journal exists without its complete pre-rollback LKG pair.

- name: Recover an interrupted rollback deterministically to pre-rollback LKG
  when:
    - carrier_gateway_recovery_transaction.results[0].stat.exists | default(false)
    - >-
      carrier_gateway_interrupted_rollback_phase.stdout | trim not in
      ['PREPARING_PRE_ROLLBACK_LKG', 'TARGET_COMMITTED', 'RECOVERY_COMMITTED']
  block:
    - name: Quiesce provider egress before interrupted rollback recovery
      ansible.builtin.include_tasks: quiesce-provider-egress.yml

    - name: Stop carrier runtime before interrupted rollback recovery
      ansible.builtin.command:
        argv: [systemctl, --user, stop, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Read the pre-recovery broker PID
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, vivolution-carrier-authority-broker.service]
      register: carrier_gateway_pre_recovery_broker_pid
      changed_when: false

    - name: Stop the broker socket and process before interrupted restore
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - vivolution-carrier-authority-broker.socket
        - vivolution-carrier-authority-broker.service

    - name: Prove no obsolete broker process survived interrupted-recovery stop
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: raise SystemExit(2)
      changed_when: false

    - name: Enter explicit interrupted-rollback recovery phase
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - "{{ carrier_gateway_interrupted_rollback_phase.stdout | trim }}"
          - --to-phase
          - RECOVERY_STARTED
      when: carrier_gateway_interrupted_rollback_phase.stdout | trim != 'RECOVERY_STARTED'
      changed_when: true

    - name: Validate interrupted pre-rollback LKG
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - validate
          - --archive
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
          - --digest
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
      changed_when: false

    - name: Restore interrupted pre-rollback LKG exactly
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - restore
          - --archive
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
          - --digest
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
      no_log: true

    - name: Reload system units after interrupted recovery
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restore root authority socket after interrupted recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.socket
        enabled: true
        state: started

    - name: Restart the restored broker process after interrupted recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.service
        state: restarted

    - name: Read restored broker PID and executable version after interrupted recovery
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [systemctl, show, --property=MainPID, --value, vivolution-carrier-authority-broker.service]
        - [/usr/local/libexec/vivolution-carrier-authority-broker, version]
      register: carrier_gateway_recovered_broker_identity
      changed_when: false

    - name: Prove interrupted recovery started the restored broker executable and version
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib, sys
            old, new, version = sys.argv[1:4]
            if not new.isdigit() or int(new) <= 1 or new == old or version != 'v4': raise SystemExit(2)
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            matches = []
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: matches.append(int(proc.name))
            if matches != [int(new)]: raise SystemExit(2)
          - "{{ carrier_gateway_pre_recovery_broker_pid.stdout | trim }}"
          - "{{ carrier_gateway_recovered_broker_identity.results[0].stdout | trim }}"
          - "{{ carrier_gateway_recovered_broker_identity.results[1].stdout | trim }}"
      changed_when: false

    - name: Reconcile authority on the restored broker before recovered runtime start
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-authority-broker
          - --authorization-root
          - "{{ carrier_gateway_state_root }}/authorization"
          - reconcile
          - --reason
          - recovery-start
      changed_when: false
      no_log: true

    - name: Reload recovered rootless Quadlet
      ansible.builtin.command:
        argv: [systemctl, --user, daemon-reload]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Restart exact restored provider egress after interrupted recovery
      ansible.builtin.include_tasks: restart-provider-egress.yml

    - name: Restart recovered pre-rollback LKG
      ansible.builtin.command:
        argv: [systemctl, --user, restart, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Require recovered pre-rollback LKG readiness
      ansible.builtin.command:
        argv: [/usr/local/libexec/vivolution-carrier-gateway-readiness]
      changed_when: false

    - name: Prove interrupted rollback recovery preserved the exact live PKI
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - snapshot-pki
          - --purpose
          - configuration-rollback
      register: carrier_gateway_interrupted_recovery_pki_snapshot
      changed_when: false
      no_log: true

    - name: Require interrupted recovery PKI digest equality
      ansible.builtin.assert:
        that:
          - >-
            carrier_gateway_interrupted_recovery_pki_snapshot.stdout ==
            carrier_gateway_pre_rollback_pki_snapshot.stdout
        fail_msg: Interrupted configuration rollback recovery changed the live PKI.
        quiet: true
      no_log: true

    - name: Mark interrupted recovery accepted only after exact readiness
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - RECOVERY_STARTED
          - --to-phase
          - RECOVERY_ACCEPTED
      changed_when: true

    - name: Durably commit interrupted recovery before residue cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-commit
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - RECOVERY_ACCEPTED
      changed_when: true

    - name: Release certificate gate after interrupted rollback recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - end
          - --purpose
          - configuration-rollback
      changed_when: true

    - name: Remove completed interrupted recovery residue after journal commit
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
        - "{{ carrier_gateway_state_root }}/rollback/staging"
        - "{{ carrier_gateway_state_root }}/rollback/failed-current"
      no_log: true

    - name: Restart certificate scheduling after interrupted recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-certificate.timer
        enabled: true
        state: started
      when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

    - name: Finalize interrupted recovery after residue and gate cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-finalize
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - RECOVERY_COMMITTED
      changed_when: true

    - name: Stop after deterministic interrupted rollback recovery
      ansible.builtin.fail:
        msg: Interrupted rollback recovered to its exact pre-rollback LKG; rerun to request a new rollback.

- name: Inspect pending and committed rollback package pairs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ carrier_gateway_state_root }}/rollback/pending-config.tar"
    - "{{ carrier_gateway_state_root }}/rollback/pending-config.tar.sha256"
    - "{{ carrier_gateway_state_root }}/rollback/previous-config.tar"
    - "{{ carrier_gateway_state_root }}/rollback/previous-config.tar.sha256"
  register: carrier_gateway_rollback_packages
  changed_when: false

- name: Select a complete pending package before the committed LKG package
  ansible.builtin.set_fact:
    carrier_gateway_selected_rollback_archive: >-
      {{ ((carrier_gateway_rollback_packages.results[0].stat.exists | default(false)) and
          (carrier_gateway_rollback_packages.results[1].stat.exists | default(false))) |
         ternary(carrier_gateway_rollback_packages.results[0].item,
                 carrier_gateway_rollback_packages.results[2].item) }}
    carrier_gateway_selected_rollback_digest: >-
      {{ ((carrier_gateway_rollback_packages.results[0].stat.exists | default(false)) and
          (carrier_gateway_rollback_packages.results[1].stat.exists | default(false))) |
         ternary(carrier_gateway_rollback_packages.results[1].item,
                 carrier_gateway_rollback_packages.results[3].item) }}
    carrier_gateway_selected_rollback_kind: >-
      {{ ((carrier_gateway_rollback_packages.results[0].stat.exists | default(false)) and
          (carrier_gateway_rollback_packages.results[1].stat.exists | default(false))) |
         ternary('pending-config', 'previous-config') }}
  no_log: true

- name: Require one complete protected rollback package pair
  ansible.builtin.assert:
    that:
      - >-
        ((carrier_gateway_rollback_packages.results[0].stat.exists | default(false)) and
         (carrier_gateway_rollback_packages.results[1].stat.exists | default(false))) or
        ((carrier_gateway_rollback_packages.results[2].stat.exists | default(false)) and
         (carrier_gateway_rollback_packages.results[3].stat.exists | default(false)))
      - >-
        carrier_gateway_rollback_packages.results |
        selectattr('stat.exists', 'defined') | selectattr('stat.exists') |
        map(attribute='stat.uid') | map('int') | unique | list == [0]
      - >-
        carrier_gateway_rollback_packages.results |
        selectattr('stat.exists', 'defined') | selectattr('stat.exists') |
        map(attribute='stat.gid') | map('int') | unique | list == [0]
      - >-
        carrier_gateway_rollback_packages.results |
        selectattr('stat.exists', 'defined') | selectattr('stat.exists') |
        map(attribute='stat.mode') | unique | list == ['0400']
    fail_msg: No complete exact root-protected rollback package pair is available.

- name: Validate exact digest-bound members and reject duplicates
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - validate
      - --archive
      - "{{ carrier_gateway_selected_rollback_archive }}"
      - --digest
      - "{{ carrier_gateway_selected_rollback_digest }}"
  changed_when: false
  no_log: true

- name: Begin crash-visible rollback preparation before creating recovery artifacts
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - transaction-begin
      - --journal
      - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
      - --target-kind
      - "{{ carrier_gateway_selected_rollback_kind }}"
  changed_when: true

- name: Create crash-recovery snapshot of exact pre-rollback LKG
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - create
      - --output
      - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
      - --digest-output
      - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  no_log: true

- name: Protect and validate the pre-rollback recovery pair
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    owner: root
    group: root
    mode: '0400'
  loop:
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  no_log: true

- name: Validate pre-rollback recovery package before protected phase transition
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - validate
      - --archive
      - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
      - --digest
      - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  changed_when: false
  no_log: true

- name: Mark the exact pre-rollback LKG protected before mutation
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - transaction-transition
      - --journal
      - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
      - --from-phase
      - PREPARING_PRE_ROLLBACK_LKG
      - --to-phase
      - PRE_ROLLBACK_LKG_PROTECTED
  changed_when: true

- name: Restore selected carrier package transactionally
  block:
    - name: Quiesce provider egress before exact target restore
      ansible.builtin.include_tasks: quiesce-provider-egress.yml

    - name: Stop rootless carrier before exact restore
      ansible.builtin.command:
        argv: [systemctl, --user, stop, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Read the pre-rollback broker PID
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, vivolution-carrier-authority-broker.service]
      register: carrier_gateway_pre_restore_broker_pid
      changed_when: false

    - name: Stop broker socket and process before restoring their files
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - vivolution-carrier-authority-broker.socket
        - vivolution-carrier-authority-broker.service

    - name: Prove no obsolete broker process survived target-restore stop
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: raise SystemExit(2)
      changed_when: false

    - name: Mark target restore started before the first restored artifact
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - PRE_ROLLBACK_LKG_PROTECTED
          - --to-phase
          - RESTORE_STARTED
      changed_when: true

    - name: Restore every protected runtime and security artifact
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - restore
          - --archive
          - "{{ carrier_gateway_selected_rollback_archive }}"
          - --digest
          - "{{ carrier_gateway_selected_rollback_digest }}"
      no_log: true

    - name: Mark target files restored before any restored process starts
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - RESTORE_STARTED
          - --to-phase
          - TARGET_RESTORED
      changed_when: true

    - name: Reload restored system units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable restored root authority socket
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.socket
        enabled: true
        state: started

    - name: Restart the restored long-running broker process explicitly
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.service
        state: restarted

    - name: Read restored broker PID and executable version
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [systemctl, show, --property=MainPID, --value, vivolution-carrier-authority-broker.service]
        - [/usr/local/libexec/vivolution-carrier-authority-broker, version]
      register: carrier_gateway_restored_broker_identity
      changed_when: false

    - name: Prove restored broker executable PID and version
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib, sys
            old, new, version = sys.argv[1:4]
            if not new.isdigit() or int(new) <= 1 or new == old or version != 'v4': raise SystemExit(2)
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            matches = []
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: matches.append(int(proc.name))
            if matches != [int(new)]: raise SystemExit(2)
          - "{{ carrier_gateway_pre_restore_broker_pid.stdout | trim }}"
          - "{{ carrier_gateway_restored_broker_identity.results[0].stdout | trim }}"
          - "{{ carrier_gateway_restored_broker_identity.results[1].stdout | trim }}"
      changed_when: false

    - name: Reconcile and burn authority again before restored service start
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-authority-broker
          - --authorization-root
          - "{{ carrier_gateway_state_root }}/authorization"
          - reconcile
          - --reason
          - restored-service-start
      changed_when: false
      no_log: true

    - name: Reload restored rootless Quadlet
      ansible.builtin.command:
        argv: [systemctl, --user, daemon-reload]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Restart exact restored provider egress before the common leg
      ansible.builtin.include_tasks: restart-provider-egress.yml

    - name: Restart restored carrier LKG
      ansible.builtin.command:
        argv: [systemctl, --user, restart, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Require restored carrier readiness
      ansible.builtin.command:
        argv: [/usr/local/libexec/vivolution-carrier-gateway-readiness]
      changed_when: false

    - name: Prove restored target preserved the exact live PKI
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - snapshot-pki
          - --purpose
          - configuration-rollback
      register: carrier_gateway_restored_target_pki_snapshot
      changed_when: false
      no_log: true

    - name: Require restored target PKI digest equality
      ansible.builtin.assert:
        that:
          - >-
            carrier_gateway_restored_target_pki_snapshot.stdout ==
            carrier_gateway_pre_rollback_pki_snapshot.stdout
        fail_msg: Configuration rollback restored obsolete or changed PKI.
        quiet: true
      no_log: true

    - name: Mark the restored target accepted only after exact readiness
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - TARGET_RESTORED
          - --to-phase
          - TARGET_ACCEPTED
      changed_when: true

    - name: Durably commit accepted target before cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-commit
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - TARGET_ACCEPTED
      changed_when: true

  rescue:
    - name: Quiesce rejected provider egress before recovery restore
      ansible.builtin.include_tasks: quiesce-provider-egress.yml

    - name: Stop rejected restored carrier state
      ansible.builtin.command:
        argv: [systemctl, --user, stop, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Stop rejected broker socket and process before recovery restore
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - vivolution-carrier-authority-broker.socket
        - vivolution-carrier-authority-broker.service

    - name: Prove no rejected broker process survived recovery stop
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: raise SystemExit(2)
      changed_when: false

    - name: Read failed rollback phase before deterministic recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-show
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
      register: carrier_gateway_rejected_rollback_phase
      changed_when: false

    - name: Mark deterministic rejection recovery started
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - "{{ carrier_gateway_rejected_rollback_phase.stdout | trim }}"
          - --to-phase
          - RECOVERY_STARTED
      when: carrier_gateway_rejected_rollback_phase.stdout | trim != 'RECOVERY_STARTED'
      changed_when: true

    - name: Restore the exact pre-rollback LKG after rejection
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - restore
          - --archive
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
          - --digest
          - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
      no_log: true

    - name: Reload system units after rejected rollback recovery
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restore root authority socket after rejected rollback
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.socket
        enabled: true
        state: started

    - name: Restart restored broker process after rejected rollback
      ansible.builtin.systemd_service:
        name: vivolution-carrier-authority-broker.service
        state: restarted

    - name: Read recovered broker PID and version after rejected rollback
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [systemctl, show, --property=MainPID, --value, vivolution-carrier-authority-broker.service]
        - [/usr/local/libexec/vivolution-carrier-authority-broker, version]
      register: carrier_gateway_rejected_recovery_broker_identity
      changed_when: false

    - name: Prove rejected rollback recovery runs the restored broker executable
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib, sys
            pid, version = sys.argv[1:3]
            if not pid.isdigit() or int(pid) <= 1 or version != 'v4': raise SystemExit(2)
            executable = b'/usr/local/libexec/vivolution-carrier-authority-broker'
            matches = []
            for proc in pathlib.Path('/proc').glob('[0-9]*'):
                try: tokens = proc.joinpath('cmdline').read_bytes().split(b'\0')
                except (FileNotFoundError, PermissionError, ProcessLookupError): continue
                if executable in tokens: matches.append(int(proc.name))
            if matches != [int(pid)]: raise SystemExit(2)
          - "{{ carrier_gateway_rejected_recovery_broker_identity.results[0].stdout | trim }}"
          - "{{ carrier_gateway_rejected_recovery_broker_identity.results[1].stdout | trim }}"
      changed_when: false

    - name: Reconcile authority before recovered pre-rollback runtime start
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-authority-broker
          - --authorization-root
          - "{{ carrier_gateway_state_root }}/authorization"
          - reconcile
          - --reason
          - rejected-recovery
      changed_when: false
      no_log: true

    - name: Restart exact pre-rollback provider egress after rejection
      ansible.builtin.include_tasks: restart-provider-egress.yml

    - name: Restart exact pre-rollback LKG after rejection
      ansible.builtin.command:
        argv: [systemctl, --user, restart, vivolution-carrier-gateway.service]
      become: true
      become_user: "{{ carrier_gateway_runtime_user }}"
      environment:
        HOME: "{{ carrier_gateway_rootless_home }}"
        XDG_RUNTIME_DIR: "{{ carrier_gateway_rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ carrier_gateway_rootless_runtime_dir }}/bus"
      changed_when: false

    - name: Require recovered pre-rollback readiness after rejection
      ansible.builtin.command:
        argv: [/usr/local/libexec/vivolution-carrier-gateway-readiness]
      changed_when: false

    - name: Prove rejected rollback recovery preserved the exact live PKI
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - snapshot-pki
          - --purpose
          - configuration-rollback
      register: carrier_gateway_rejected_recovery_pki_snapshot
      changed_when: false
      no_log: true

    - name: Require rejected recovery PKI digest equality
      ansible.builtin.assert:
        that:
          - >-
            carrier_gateway_rejected_recovery_pki_snapshot.stdout ==
            carrier_gateway_pre_rollback_pki_snapshot.stdout
        fail_msg: Rejected configuration rollback recovery changed the live PKI.
        quiet: true
      no_log: true

    - name: Mark rejected rollback recovery accepted
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-transition
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --from-phase
          - RECOVERY_STARTED
          - --to-phase
          - RECOVERY_ACCEPTED
      changed_when: true

    - name: Durably commit rejected rollback recovery before residue cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-commit
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - RECOVERY_ACCEPTED
      changed_when: true

    - name: Release certificate gate after rejected rollback recovery
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
          - end
          - --purpose
          - configuration-rollback
      changed_when: true

    - name: Restart certificate scheduling after rejected rollback recovery
      ansible.builtin.systemd_service:
        name: vivolution-carrier-certificate.timer
        enabled: true
        state: started
      when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

    - name: Remove recovery residue only after journal commit
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
        - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
      no_log: true

    - name: Finalize rejected recovery after residue and gate cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/vivolution-carrier-rollback-bundle
          - transaction-finalize
          - --journal
          - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
          - --expected-phase
          - RECOVERY_COMMITTED
      changed_when: true

    - name: Fail after deterministic pre-rollback LKG recovery
      ansible.builtin.fail:
        msg: Carrier rollback was rejected; exact pre-rollback LKG was restored and verified.

- name: Release certificate gate after accepted rollback
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-certificate/carrier-certificate-operation-guard
      - end
      - --purpose
      - configuration-rollback
  changed_when: true

- name: Restart certificate scheduling after accepted rollback
  ansible.builtin.systemd_service:
    name: vivolution-carrier-certificate.timer
    enabled: true
    state: started
  when: carrier_gateway_rollback_certificate_load_state.results[0].stdout | trim == 'loaded'

- name: Remove consumed rollback and recovery residue after journal commit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ carrier_gateway_selected_rollback_archive }}"
    - "{{ carrier_gateway_selected_rollback_digest }}"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar"
    - "{{ carrier_gateway_state_root }}/rollback/pre-rollback-lkg.tar.sha256"
  no_log: true

- name: Finalize accepted rollback after residue and certificate-gate cleanup
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-rollback-bundle
      - transaction-finalize
      - --journal
      - "{{ carrier_gateway_state_root }}/rollback/transaction.json"
      - --expected-phase
      - TARGET_COMMITTED
  changed_when: true
