# The invalid number is intentionally non-routable and never sent to a provider.
carrier_gateway_tone_test_e164: '+9710000002001'
carrier_gateway_echo_test_e164: '+9710000002002'

# The Teams/Edge-facing leg above is provider-independent.  The southbound SIP
# provider is a fail-closed data contract: disabled defaults render no carrier
# endpoint, credential, route, public address, or network authority.  A provider
# profile (Twilio is one example) supplies these values through protected
# inventory; credentials never belong in this repository.
carrier_gateway_provider_enabled: false
carrier_gateway_provider_profile: ''
carrier_gateway_provider_enable_acknowledgement: ''
carrier_gateway_provider_signaling_fqdn: ''
carrier_gateway_provider_signaling_transport: ''
carrier_gateway_provider_signaling_port: 0
