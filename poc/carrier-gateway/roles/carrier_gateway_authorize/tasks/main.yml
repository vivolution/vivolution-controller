---
- name: Require the exact one-call authorization acknowledgement
  ansible.builtin.assert:
    that:
      - >-
        carrier_gateway_provider_authorize_acknowledgement ==
        'AUTHORIZE_EXACTLY_ONE_BILLABLE_PSTN_CALL'
      - >-
        carrier_gateway_provider_authorization_request_id is match(
          '^[a-z0-9][a-z0-9-]{7,63}$')
      - >-
        carrier_gateway_provider_authorization_destination_e164 is match(
          '^\\+[1-9][0-9]{7,14}$')
      - carrier_gateway_provider_geo_allowlist == ['AE']
      - carrier_gateway_provider_destination_prefixes | length > 0
      - carrier_gateway_provider_authorization_max_call_seconds | int >= 1
      - >-
        carrier_gateway_provider_authorization_max_call_seconds | int <=
        carrier_gateway_provider_max_call_seconds | int
      - carrier_gateway_provider_authorization_max_spend_usd | float > 0
      - >-
        carrier_gateway_provider_authorization_max_spend_usd | float <=
        carrier_gateway_provider_maximum_spend_per_call_usd | float
      - >-
        carrier_gateway_provider_authorization_max_spend_usd | float >=
        (((carrier_gateway_provider_authorization_max_call_seconds | int + 59) // 60) *
         carrier_gateway_provider_cost_per_minute_ceiling_usd | float)
      - >-
        carrier_gateway_provider_authorization_expires_epoch | int >=
        ansible_date_time.epoch | int + 60
      - >-
        carrier_gateway_provider_authorization_expires_epoch | int <=
        ansible_date_time.epoch | int + 600
    fail_msg: One-call SIP-provider authorization is missing or exceeds the POC bounds.
  no_log: true

- name: Require destination inside the reviewed exact-prefix authority
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json, sys
        destination = sys.argv[1]
        prefixes = json.loads(sys.argv[2])
        raise SystemExit(0 if sum(destination.startswith(p) for p in prefixes) == 1 else 2)
      - "{{ carrier_gateway_provider_authorization_destination_e164 }}"
      - "{{ carrier_gateway_provider_destination_prefixes | to_json }}"
  changed_when: false
  no_log: true

- name: Inspect the installed provider state and root authority boundary
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /etc/vivolution/carrier-gateway/provider-enabled
    - /etc/vivolution/carrier-gateway/provider-profile
    - "{{ carrier_gateway_state_root }}/authorization"
    - "{{ carrier_gateway_state_root }}/authorization/claims"
    - "{{ carrier_gateway_state_root }}/authorization/invalidated"
    - "{{ carrier_gateway_state_root }}/authorization/ids"
    - /run/vivolution-carrier-authority.sock
    - /usr/local/libexec/vivolution-carrier-authority-broker
  register: carrier_gateway_authorize_boundary
  changed_when: false
  no_log: true

- name: Require the exact root-owned broker boundary
  ansible.builtin.assert:
    that:
      - carrier_gateway_authorize_boundary.results[0].stat.isreg | default(false)
      - not (carrier_gateway_authorize_boundary.results[0].stat.islnk | default(false))
      - carrier_gateway_authorize_boundary.results[0].stat.uid | int == 0
      - carrier_gateway_authorize_boundary.results[0].stat.gid | int == 0
      - carrier_gateway_authorize_boundary.results[0].stat.mode == '0444'
      - carrier_gateway_authorize_boundary.results[1].stat.isreg | default(false)
      - not (carrier_gateway_authorize_boundary.results[1].stat.islnk | default(false))
      - carrier_gateway_authorize_boundary.results[1].stat.uid | int == 0
      - carrier_gateway_authorize_boundary.results[1].stat.gid | int == 0
      - carrier_gateway_authorize_boundary.results[1].stat.mode == '0444'
      - carrier_gateway_authorize_boundary.results[2].stat.isdir | default(false)
      - not (carrier_gateway_authorize_boundary.results[2].stat.islnk | default(false))
      - carrier_gateway_authorize_boundary.results[2].stat.uid | int == 0
      - carrier_gateway_authorize_boundary.results[2].stat.gid | int == 0
      - carrier_gateway_authorize_boundary.results[2].stat.mode == '0700'
      - >-
        carrier_gateway_authorize_boundary.results[3:6] |
        map(attribute='stat.isdir') | select('equalto', true) | list | length == 3
      - >-
        carrier_gateway_authorize_boundary.results[3:6] |
        map(attribute='stat.uid') | map('int') | unique | list == [0]
      - >-
        carrier_gateway_authorize_boundary.results[3:6] |
        map(attribute='stat.gid') | map('int') | unique | list == [0]
      - >-
        carrier_gateway_authorize_boundary.results[3:6] |
        map(attribute='stat.mode') | unique | list == ['0700']
      - carrier_gateway_authorize_boundary.results[6].stat.issock | default(false)
      - carrier_gateway_authorize_boundary.results[6].stat.uid | int == 0
      - carrier_gateway_authorize_boundary.results[6].stat.gid | int == 10004
      - carrier_gateway_authorize_boundary.results[6].stat.mode == '0660'
      - carrier_gateway_authorize_boundary.results[7].stat.isreg | default(false)
      - carrier_gateway_authorize_boundary.results[7].stat.uid | int == 0
      - carrier_gateway_authorize_boundary.results[7].stat.gid | int == 0
      - carrier_gateway_authorize_boundary.results[7].stat.mode == '0550'
    fail_msg: Root-owned carrier authority broker boundary is not exact.
  no_log: true

- name: Read the installed provider feature state
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/vivolution/carrier-gateway/provider-enabled
    - /etc/vivolution/carrier-gateway/provider-profile
  register: carrier_gateway_authorize_provider_state
  no_log: true

- name: Require an installed generic provider trunk authority
  ansible.builtin.assert:
    that:
      - >-
        carrier_gateway_authorize_provider_state.results[0].content |
        b64decode == 'true\n'
      - >-
        carrier_gateway_authorize_provider_state.results[1].content |
        b64decode is match('^[a-z0-9][a-z0-9-]{1,31}\\n$')
    fail_msg: A SIP-provider profile is not explicitly enabled on this carrier gateway.
  no_log: true

- name: Calculate the integer spend evidence bound
  ansible.builtin.set_fact:
    carrier_gateway_authorization_max_spend_microusd: >-
      {{ (carrier_gateway_provider_authorization_max_spend_usd | float * 1000000) |
         round(0, 'floor') | int }}
  no_log: true

- name: Reconcile and burn any interrupted prior authority before arming
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-authority-broker
      - --authorization-root
      - "{{ carrier_gateway_state_root }}/authorization"
      - reconcile
      - --reason
      - pre-authorization
  changed_when: false
  no_log: true

- name: Arm one root-owned exact-destination authority without overwrite
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/vivolution-carrier-authority-broker
      - --authorization-root
      - "{{ carrier_gateway_state_root }}/authorization"
      - --expected-uid
      - '10004'
      - --max-seconds
      - "{{ carrier_gateway_provider_max_call_seconds | int }}"
      - --max-spend-microusd
      - "{{ (carrier_gateway_provider_maximum_spend_per_call_usd | float * 1000000) | int }}"
      - arm
      - --stdin
    stdin: >-
      {{ {
          'requestId': carrier_gateway_provider_authorization_request_id,
          'destination': carrier_gateway_provider_authorization_destination_e164,
          'expiresEpoch': carrier_gateway_provider_authorization_expires_epoch | int,
          'maxCallSeconds': carrier_gateway_provider_authorization_max_call_seconds | int,
          'maxSpendMicroUsd': carrier_gateway_authorization_max_spend_microusd | int
         } | to_json }}
    stdin_add_newline: true
  register: carrier_gateway_authorization_armed
  changed_when: true
  no_log: true

- name: Report armed state without destination or credential data
  ansible.builtin.debug:
    msg: >-
      AUTHORIZED_ONE_CALL request_id={{ carrier_gateway_provider_authorization_request_id }}
      expires_epoch={{ carrier_gateway_provider_authorization_expires_epoch | int }}
      maximum_calls=1 max_seconds={{ carrier_gateway_provider_authorization_max_call_seconds | int }}
