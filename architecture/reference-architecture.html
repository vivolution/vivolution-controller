<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vivolution SBC — Candidate Reference Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 22px; font-weight: 650; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .label { font-size: 14px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .zone-label { font-size: 13px; font-weight: 650; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; rx: 12; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .manage { stroke-dasharray: 6 5; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; rx: 16; }
</style>
<main>
  <svg viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Vivolution SBC candidate reference architecture</title>
    <desc id="desc">Multiple Microsoft 365 customer tenants connect through customer-derived FQDNs to a redundant certified SBC pair in UAE failure domains, then to customer-owned carrier and telephony systems. A separate control plane manages isolation and operations.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <text x="30" y="38" class="title">Vivolution SBC — Candidate Multi-Tenant Architecture</text>
    <text x="30" y="62" class="subtitle">Discovery concept: certified Teams edge, strict tenant isolation, BYOC-first carrier boundary</text>

    <rect x="30" y="90" width="260" height="610" class="zone" />
    <rect x="315" y="90" width="560" height="610" class="zone" />
    <rect x="900" y="90" width="270" height="610" class="zone" />
    <text x="50" y="118" class="zone-label">Customer Microsoft 365</text>
    <text x="335" y="118" class="zone-label">Vivolution UAE service boundary</text>
    <text x="920" y="118" class="zone-label">Licensed carrier / customer edge</text>

    <path d="M 250 210 C 320 210, 340 245, 400 270" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M 250 390 C 320 390, 340 355, 400 330" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M 720 270 C 805 270, 845 230, 930 210" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M 720 330 C 805 330, 845 370, 930 390" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M 595 205 L 595 245" class="edge manage" marker-end="url(#arrow)" />
    <path d="M 595 370 L 595 455" class="edge manage" marker-end="url(#arrow)" />
    <path d="M 515 330 L 515 500" class="edge manage" marker-end="url(#arrow)" />

    <rect x="70" y="155" width="180" height="110" class="node input" />
    <text x="160" y="188" text-anchor="middle" class="label">Customer A</text>
    <text x="160" y="212" text-anchor="middle" class="small">Teams Phone tenant</text>
    <text x="160" y="235" text-anchor="middle" class="small">customer-a.sbc1 / sbc2</text>

    <rect x="70" y="335" width="180" height="110" class="node input" />
    <text x="160" y="368" text-anchor="middle" class="label">Customer B … N</text>
    <text x="160" y="392" text-anchor="middle" class="small">Separate M365 tenants</text>
    <text x="160" y="415" text-anchor="middle" class="small">Unique derived FQDNs</text>

    <rect x="430" y="140" width="330" height="65" class="node storage" />
    <text x="595" y="169" text-anchor="middle" class="label">Vivolution control plane</text>
    <text x="595" y="190" text-anchor="middle" class="small">Onboarding · RBAC · policy · audit · billing</text>

    <rect x="400" y="245" width="320" height="125" class="node process" />
    <text x="560" y="276" text-anchor="middle" class="label">Microsoft-certified SBC pair</text>
    <text x="560" y="300" text-anchor="middle" class="small">SBC 1 + SBC 2 · separate UAE failure domains</text>
    <text x="560" y="323" text-anchor="middle" class="small">TLS/SRTP · SIP OPTIONS · failover</text>
    <text x="560" y="346" text-anchor="middle" class="small">Shared capacity; controlled change radius</text>

    <rect x="390" y="455" width="250" height="150" class="node neutral" />
    <text x="515" y="486" text-anchor="middle" class="label">Per-tenant routing contexts</text>
    <text x="515" y="511" text-anchor="middle" class="small">Trunks · dial plans · CLI</text>
    <text x="515" y="534" text-anchor="middle" class="small">Quotas · fraud controls</text>
    <text x="515" y="557" text-anchor="middle" class="small">CDR / trace separation</text>
    <text x="515" y="580" text-anchor="middle" class="small">Secrets · backup · audit</text>

    <rect x="660" y="455" width="170" height="150" class="node storage" />
    <text x="745" y="486" text-anchor="middle" class="label">Operations</text>
    <text x="745" y="511" text-anchor="middle" class="small">24/7 health</text>
    <text x="745" y="534" text-anchor="middle" class="small">Quality / MOS</text>
    <text x="745" y="557" text-anchor="middle" class="small">Certificates</text>
    <text x="745" y="580" text-anchor="middle" class="small">Incident ownership</text>

    <rect x="930" y="155" width="210" height="110" class="node external" />
    <text x="1035" y="188" text-anchor="middle" class="label">UAE-licensed carrier</text>
    <text x="1035" y="212" text-anchor="middle" class="small">Approved hosted SIP trunk</text>
    <text x="1035" y="235" text-anchor="middle" class="small">Provider of record · PSTN · emergency</text>

    <rect x="930" y="335" width="210" height="110" class="node external" />
    <text x="1035" y="368" text-anchor="middle" class="label">Customer telephony</text>
    <text x="1035" y="392" text-anchor="middle" class="small">PBX · contact centre</text>
    <text x="1035" y="415" text-anchor="middle" class="small">Analogue / branch systems</text>

    <rect x="930" y="500" width="210" height="105" class="node risk" />
    <text x="1035" y="530" text-anchor="middle" class="label">Mandatory gates</text>
    <text x="1035" y="554" text-anchor="middle" class="small">TDRA · carrier terms</text>
    <text x="1035" y="577" text-anchor="middle" class="small">Vendor licence · unit economics</text>

    <text x="30" y="735" class="subtitle">Solid arrows: voice/signaling paths · Dashed arrows: management/telemetry · No customer or POC deployment is approved.</text>
  </svg>
</main>
