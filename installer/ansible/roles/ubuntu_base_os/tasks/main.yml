---
- name: Inspect an existing package service-start policy
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
    follow: false
  register: cp_policy_rc_d_stat

- name: Read an existing package service-start policy
  ansible.builtin.slurp:
    src: /usr/sbin/policy-rc.d
  register: cp_policy_rc_d_content
  when: cp_policy_rc_d_stat.stat.exists

- name: Reject an unrelated package service-start policy
  ansible.builtin.assert:
    that:
      - >-
        not cp_policy_rc_d_stat.stat.exists or
        (cp_policy_rc_d_stat.stat.isreg | default(false) and
         not (cp_policy_rc_d_stat.stat.islnk | default(false)) and
         (cp_policy_rc_d_content.content | b64decode) ==
         '#!/bin/sh\n# Managed temporarily by Vivolution Controller installation.\nif [ -e /run/vivolution-installer-policy-rc-active ]; then\n  exit 101\nfi\nexit 0\n')
    fail_msg: An unrelated /usr/sbin/policy-rc.d prevents safe package installation.

- name: Mark the package service-start guard active for this boot
  ansible.builtin.copy:
    dest: /run/vivolution-installer-policy-rc-active
    owner: root
    group: root
    mode: '0600'
    content: "active\n"
  changed_when: false

- name: Block package maintainer scripts from exposing services before firewall activation
  ansible.builtin.copy:
    dest: /usr/sbin/policy-rc.d
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      # Managed temporarily by Vivolution Controller installation.
      if [ -e /run/vivolution-installer-policy-rc-active ]; then
        exit 101
      fi
      exit 0
  changed_when: false

- name: Persistently mask network services until the firewall and managed policy are ready
  ansible.builtin.command:
    argv:
      - systemctl
      - mask
      - "{{ item }}"
  loop:
    - caddy.service
    - pgbouncer.service
    - postgresql@17-main.service
    - postgresql.service
  register: cp_pre_firewall_service_masks
  changed_when: >-
    'Created symlink' in
    ((cp_pre_firewall_service_masks.stdout | default('')) ~
     (cp_pre_firewall_service_masks.stderr | default('')))

- name: Install trusted repository bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - postgresql-common
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180

- name: Create exact Vivolution configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/vivolution, mode: '0750'}
    - {path: /etc/vivolution/releases, mode: '0700'}

- name: Bind the host to the standalone installer
  ansible.builtin.copy:
    dest: /etc/vivolution/installation-owner
    owner: root
    group: root
    mode: '0600'
    content: |
      owner=vivolution-controller-installer
      schema=1

- name: Create exact Vivolution state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - /var/lib/vivolution
    - /var/lib/vivolution/releases
    - /var/lib/vivolution/artifacts
    - /var/lib/vivolution/backups

- name: Create protected host ownership manifest directory
  ansible.builtin.file:
    path: /var/lib/vivolution/ownership
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Record the immutable pre-install Chrony configuration state
  ansible.builtin.copy:
    dest: /var/lib/vivolution/ownership/chrony-preinstall.state
    owner: root
    group: root
    mode: '0600'
    force: false
    content: |
      owner=vivolution-controller-installer
      schema=1
      config_present={{ 'yes' if cp_chrony_config_preexisting | bool else 'no' }}

- name: Read the immutable pre-install Chrony configuration state
  ansible.builtin.slurp:
    src: /var/lib/vivolution/ownership/chrony-preinstall.state
  register: cp_chrony_preinstall_state

- name: Validate the immutable pre-install Chrony configuration state
  ansible.builtin.assert:
    that:
      - >-
        (cp_chrony_preinstall_state.content | b64decode) in
        ['owner=vivolution-controller-installer\nschema=1\nconfig_present=yes\n',
         'owner=vivolution-controller-installer\nschema=1\nconfig_present=no\n']
    fail_msg: The saved pre-install Chrony ownership state is invalid.

- name: Remember whether an original provider Chrony configuration must be preserved
  ansible.builtin.set_fact:
    cp_chrony_original_config_present: >-
      {{ (cp_chrony_preinstall_state.content | b64decode).endswith('config_present=yes\n') }}

- name: Create protected original-host backup directory when custom time is selected
  ansible.builtin.file:
    path: /var/lib/vivolution/artifacts/original-host
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - cp_ntp_mode == 'custom'
    - cp_chrony_original_config_present | bool

- name: Inspect an existing original provider Chrony backup
  ansible.builtin.stat:
    path: /var/lib/vivolution/artifacts/original-host/chrony.conf
    follow: false
  register: cp_original_chrony_backup
  when:
    - cp_ntp_mode == 'custom'
    - cp_chrony_original_config_present | bool

- name: Reject an unsafe original provider Chrony backup object
  ansible.builtin.assert:
    that:
      - >-
        not cp_original_chrony_backup.stat.exists or
        (cp_original_chrony_backup.stat.isreg | default(false) and
         not (cp_original_chrony_backup.stat.islnk | default(false)) and
         cp_original_chrony_backup.stat.uid | int == 0 and
         cp_original_chrony_backup.stat.gid | int == 0 and
         cp_original_chrony_backup.stat.mode == '0600' and
         cp_original_chrony_backup.stat.nlink | int == 1)
    fail_msg: The saved original provider Chrony configuration is unsafe.
  when:
    - cp_ntp_mode == 'custom'
    - cp_chrony_original_config_present | bool

- name: Preserve the original provider Chrony configuration before custom ownership
  ansible.builtin.copy:
    src: /etc/chrony/chrony.conf
    remote_src: true
    dest: /var/lib/vivolution/artifacts/original-host/chrony.conf
    owner: root
    group: root
    mode: '0600'
    force: false
  when:
    - cp_ntp_mode == 'custom'
    - cp_chrony_original_config_present | bool
    - not cp_original_chrony_backup.stat.exists

- name: Create protected repository bootstrap workspace
  ansible.builtin.file:
    path: /var/cache/vivolution-installer
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Download the PostgreSQL Global Development Group signing key
  ansible.builtin.get_url:
    url: "{{ cp_pgdg_signing_key_url }}"
    dest: /var/cache/vivolution-installer/ACCC4CF8.asc
    owner: root
    group: root
    mode: '0600'
    force: true
    timeout: 30
  changed_when: false

- name: Inspect the complete PGDG signing-key identity
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --with-colons
      - --show-keys
      - /var/cache/vivolution-installer/ACCC4CF8.asc
  register: cp_pgdg_key_identity
  changed_when: false

- name: Require the single expected full PGDG primary-key fingerprint
  ansible.builtin.assert:
    that:
      - cp_pgdg_key_identity.stdout | regex_findall('(?m)^pub:') | length == 1
      - >-
        (cp_pgdg_key_identity.stdout |
         regex_findall('(?m)^fpr:::::::::([0-9A-F]{40}):$') | first) ==
        cp_pgdg_signing_key_fingerprint
      - cp_pgdg_signing_key_fingerprint == 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
    fail_msg: The downloaded PGDG key does not match the full approved ACCC4CF8 fingerprint.

- name: Create the PGDG keyring directory
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Convert the verified PGDG key into an APT keyring candidate
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - /var/cache/vivolution-installer/apt.postgresql.org.gpg
      - /var/cache/vivolution-installer/ACCC4CF8.asc
  changed_when: false

- name: Install the verified PGDG APT keyring
  ansible.builtin.copy:
    src: /var/cache/vivolution-installer/apt.postgresql.org.gpg
    remote_src: true
    dest: "{{ cp_pgdg_keyring_path }}"
    owner: root
    group: root
    mode: '0644'
  register: cp_pgdg_keyring

- name: Configure the Ubuntu Noble PGDG repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://apt.postgresql.org/pub/repos/apt
      Suites: noble-pgdg
      Components: main
      Signed-By: {{ cp_pgdg_keyring_path }}
  register: cp_pgdg_repository

- name: Refresh APT metadata after verified PGDG repository changes
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 180
  when: cp_pgdg_keyring.changed or cp_pgdg_repository.changed

- name: Apply available Ubuntu updates without package removals
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  # A resumed, partially installed controller may already have live daemons.
  # Do not upgrade their packages while policy-rc.d deliberately suppresses
  # restarts; unattended-upgrades owns later security maintenance normally.
  when: not (cp_existing_managed_install | bool)

- name: Detect whether Ubuntu updates require a reboot before deployment
  ansible.builtin.stat:
    path: /var/run/reboot-required
    follow: false
  register: cp_post_update_reboot_required

- name: Stop safely when updated host packages require a reboot
  ansible.builtin.assert:
    that:
      - not cp_post_update_reboot_required.stat.exists
    fail_msg: >-
      Ubuntu updates require a reboot. Reboot this VM, then run
      curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https'
      --tlsv1.2 https://raw.githubusercontent.com/vivolution/vivolution-install/v0.3.0-rc7/install.sh
      | sudo sh -s -- resume; Controller network services remain masked.

- name: Install standalone controller foundation packages
  ansible.builtin.apt:
    name:
      - acl
      - caddy
      - chrony
      - curl
      - iproute2
      - jq
      - openssl
      - pgbouncer
      - podman
      - postgresql-17
      - postgresql-client-17
      - postgresql-contrib-17
      - python3-psycopg
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180

- name: Install the host firewall only when the installer owns it
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  when: cp_firewall_mode == 'installer'

- name: Inspect the configured host timezone
  ansible.builtin.command:
    argv: [timedatectl, show, --property=Timezone, --value]
  register: cp_current_timezone
  changed_when: false

- name: Apply the selected canonical IANA timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, "{{ cp_timezone }}"]
  when: cp_current_timezone.stdout | trim != cp_timezone
  changed_when: true

- name: Inspect the hardware clock mode
  ansible.builtin.command:
    argv: [timedatectl, show, --property=LocalRTC, --value]
  register: cp_local_rtc_mode
  changed_when: false

- name: Keep the hardware clock in UTC
  ansible.builtin.command:
    argv: [timedatectl, set-local-rtc, '0', --adjust-system-clock]
  when: cp_local_rtc_mode.stdout | trim != 'no'
  changed_when: true

- name: Install the declared Chrony client policy
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/chronyd -p -f %s
  register: cp_chrony_configuration
  when: cp_ntp_mode == 'custom'

- name: Validate the effective automatic or custom Chrony policy
  ansible.builtin.command:
    argv: [/usr/sbin/chronyd, -p, -f, /etc/chrony/chrony.conf]
  register: cp_effective_chrony_configuration
  changed_when: false
  failed_when: false

- name: Require a valid client-only Chrony policy
  ansible.builtin.assert:
    that:
      - cp_effective_chrony_configuration.rc == 0
      - >-
        cp_effective_chrony_configuration.stdout |
        regex_search('(?m)^allow(?:\\s|$)') is none
    fail_msg: >-
      The effective Chrony policy is invalid or permits inbound NTP clients.
      Automatic mode preserves safe provider sources; custom mode owns the
      exact selected sources.

- name: Inspect the replaced systemd-timesyncd unit before provider handoff
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --no-pager
      - systemd-timesyncd.service
  register: cp_systemd_timesyncd_before_handoff
  changed_when: false
  failed_when: false

- name: Stop and disable a loaded systemd-timesyncd provider
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: false
    state: stopped
  when: "'LoadState=loaded' in cp_systemd_timesyncd_before_handoff.stdout_lines"

- name: Stop an active package-replaced systemd-timesyncd provider
  ansible.builtin.command:
    argv: [systemctl, stop, systemd-timesyncd.service]
  when:
    - "'LoadState=loaded' not in cp_systemd_timesyncd_before_handoff.stdout_lines"
    - >-
      cp_systemd_timesyncd_before_handoff.stdout_lines |
      intersect([
        'ActiveState=active',
        'ActiveState=activating',
        'ActiveState=reloading',
        'ActiveState=deactivating'
      ]) | length > 0
  changed_when: true

- name: Activate the managed Chrony time client
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: >-
      {{ 'restarted'
         if (cp_chrony_configuration.changed | default(false))
         else 'started' }}

- name: Inspect the replaced systemd-timesyncd provider
  ansible.builtin.command:
    argv: [systemctl, is-active, systemd-timesyncd.service]
  register: cp_systemd_timesyncd_state
  changed_when: false
  failed_when: false

- name: Require Chrony to be the only active host time authority
  ansible.builtin.assert:
    that:
      - cp_systemd_timesyncd_state.rc in [3, 4]
      - >-
        cp_systemd_timesyncd_state.stdout | trim not in
        ['active', 'activating', 'reloading', 'deactivating']
    fail_msg: systemd-timesyncd remains active alongside Chrony; refusing competing clocks.

- name: Wait for Chrony to select a bounded synchronized source
  ansible.builtin.command:
    argv:
      - chronyc
      - waitsync
      - '60'
      - '1.0'
      - '0'
      - '2'
  environment:
    LC_ALL: C
  register: cp_chrony_waitsync
  changed_when: false
  failed_when: false

- name: Inspect the effective Chrony synchronization state
  ansible.builtin.command:
    argv: [chronyc, -n, tracking]
  environment:
    LC_ALL: C
  register: cp_chrony_tracking
  changed_when: false
  failed_when: false

- name: Inspect systemd time synchronization after Chrony activation
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=NTP
      - --property=NTPSynchronized
      - --property=Timezone
      - --property=LocalRTC
      - --no-pager
  register: cp_managed_time_synchronization
  changed_when: false

- name: Require synchronized UTC-backed host time before controller services
  ansible.builtin.assert:
    that:
      - cp_chrony_waitsync.rc == 0
      - cp_chrony_tracking.rc == 0
      - >-
        cp_chrony_tracking.stdout |
        regex_search('(?m)^Leap status\\s*:\\s*Normal$') is not none
      - >-
        cp_chrony_tracking.stdout |
        regex_search('(?m)^Stratum\\s*:\\s*([1-9][0-9]*)$', '\\1') is not none
      - "'NTP=yes' in cp_managed_time_synchronization.stdout_lines"
      - "'NTPSynchronized=yes' in cp_managed_time_synchronization.stdout_lines"
      - "'Timezone=' ~ cp_timezone in cp_managed_time_synchronization.stdout_lines"
      - "'LocalRTC=no' in cp_managed_time_synchronization.stdout_lines"
    fail_msg: >-
      Chrony did not achieve a trusted synchronized state. Verify outbound UDP
      123, DNS when hostnames are used, and the selected NTP sources before
      retrying; controller, database, and ingress services remain masked.

- name: Require PostgreSQL 17 packages from the verified repository
  ansible.builtin.command:
    argv: [apt-cache, policy, postgresql-17]
  register: cp_postgresql_17_policy
  changed_when: false

- name: Validate installed PostgreSQL 17 package policy
  ansible.builtin.assert:
    that:
      - "'Installed: 17.' in cp_postgresql_17_policy.stdout"
      - "'https://apt.postgresql.org/pub/repos/apt' in cp_postgresql_17_policy.stdout"
      - "'noble-pgdg' in cp_postgresql_17_policy.stdout"
    fail_msg: PostgreSQL 17 was not installed from the verified Noble PGDG repository.

- name: Set controller hostname
  ansible.builtin.hostname:
    name: "{{ cp_expected_hostname }}"
    use: systemd

- name: Keep local hostname resolution consistent
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1\t{{ cp_expected_hostname }}"
    state: present

- name: Inspect systemd-resolved state without changing ownership of DNS
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - systemd-resolved.service
      - --property=LoadState
      - --property=ActiveState
  register: cp_systemd_resolved_state
  changed_when: false
  failed_when: false

- name: Remember whether systemd-resolved is active
  ansible.builtin.set_fact:
    cp_systemd_resolved_active: >-
      {{ cp_systemd_resolved_state.rc == 0 and
         'LoadState=loaded' in cp_systemd_resolved_state.stdout_lines and
         'ActiveState=active' in cp_systemd_resolved_state.stdout_lines }}

- name: Create systemd-resolved hardening directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable LLMNR and multicast DNS
  ansible.builtin.template:
    src: 99-vivolution-hardening.conf.j2
    dest: /etc/systemd/resolved.conf.d/99-vivolution-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart systemd-resolved

- name: Create journald policy directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bound persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/20-vivolution-limits.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ cp_journal_max_use }}
      RuntimeMaxUse=64M
      MaxRetentionSec=14day
  notify: Restart systemd-journald

- name: Enable Ubuntu security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52vivolution-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable daily APT metadata and unattended security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Apply resolver and journal handlers before validation
  ansible.builtin.meta: flush_handlers

- name: Inspect forbidden LLMNR listeners
  ansible.builtin.command:
    argv: [ss, -H, -lntu, sport, '=', ':5355']
  register: cp_llmnr_listeners
  changed_when: false

- name: Inspect effective resolver protocols
  ansible.builtin.command:
    argv: [resolvectl, --no-pager, status]
  register: cp_resolved_protocols
  changed_when: false
  when: cp_systemd_resolved_active | bool

- name: Require multicast name-resolution hardening
  ansible.builtin.assert:
    that:
      - cp_llmnr_listeners.stdout | trim | length == 0
      - >-
        (not cp_systemd_resolved_active | bool) or
        ('+LLMNR' not in cp_resolved_protocols.stdout and
         '+mDNS' not in cp_resolved_protocols.stdout)
    fail_msg: LLMNR or multicast DNS remains active after hardening.

- name: Remove transient PGDG key material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/cache/vivolution-installer/ACCC4CF8.asc
    - /var/cache/vivolution-installer/apt.postgresql.org.gpg
  changed_when: false

- name: Record exact installer-owned Ubuntu host artifacts and settings
  ansible.builtin.template:
    src: ubuntu-host.manifest.j2
    dest: /var/lib/vivolution/ownership/ubuntu-host.manifest
    owner: root
    group: root
    mode: '0600'
