---
# Template only. Replace the .invalid names and enroll their SSH host keys
# before running install-edge.yml. Never disable StrictHostKeyChecking.
all:
  children:
    # Required only by transition-direct-routing-replacement.yml so it can
    # prove the preserved synthetic predecessor through the CP1 fixture before
    # and after replacement staging. The normal Edge install/activate plays do
    # not target this group.
    controllers:
      hosts:
        cp1_fixture:
          ansible_host: cp1-fixture.example.invalid
          ansible_port: 22
          ansible_user: cpadmin
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "{{ lookup('env', 'VIVO_CP1_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -F /dev/null
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o 'UserKnownHostsFile="{{ inventory_dir }}/generated/known_hosts"'
            -o GlobalKnownHostsFile=/dev/null
    # The fixture-PKI rotation play targets this narrow alias while the Direct
    # Routing transition continues to require the controllers group above.
    fixture_controller:
      children:
        controllers: {}
    edge_nodes:
      hosts:
        sbc1:
          ansible_host: sbc1.example.invalid
          ansible_port: 22
          ansible_user: cpadmin
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "{{ lookup('env', 'VIVO_EDGE_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -F /dev/null
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o 'UserKnownHostsFile="{{ inventory_dir }}/generated/known_hosts"'
            -o GlobalKnownHostsFile=/dev/null
          edge_public_ipv4: ''
          edge_private_ipv4: 10.20.2.4
          edge_slot: A
          edge_azure_dns_zone: acme-sbc1.voice.example.invalid
          edge_direct_predecessor_ansible_host: REPLACE_SBC1_SYNTHETIC_PREDECESSOR_HOST
          edge_direct_predecessor_generation: 0
          edge_direct_predecessor_ssh_port: 22
          edge_direct_predecessor_ansible_user: cpadmin
          edge_direct_predecessor_ssh_private_key_file: "{{ lookup('env', 'VIVO_EDGE_SSH_KEY') }}"
          edge_direct_predecessor_activation_sequence: 0
          edge_direct_predecessor_manifest_digest: sha256:REPLACE_SBC1_SYNTHETIC_MANIFEST_DIGEST
          edge_fixture_client_certificate_src: "{{ inventory_dir }}/generated/fixture/sbc1.crt"
          edge_fixture_client_key_src: "{{ inventory_dir }}/generated/fixture/sbc1.key"
          edge_fixture_client_certificate_sha256: REPLACE_SBC1_FIXTURE_CERT_SHA256
          edge_fixture_client_key_sha256: REPLACE_SBC1_FIXTURE_KEY_SHA256
          edge_signed_envelope_src: "{{ inventory_dir }}/generated/envelopes/sbc1.json"
          edge_signed_envelope_sha256: REPLACE_SBC1_ENVELOPE_SHA256
          edge_activation_sequence: 0
          edge_activation_manifest_digest: sha256:REPLACE_SBC1_MANIFEST_DIGEST
          edge_activation_recovery_node_id: REPLACE_SBC1_RECOVERY_NODE_ID
          edge_activation_recovery_sequence: 0
          edge_activation_recovery_manifest_digest: sha256:REPLACE_SBC1_RECOVERY_MANIFEST_DIGEST
        sbc2:
          ansible_host: sbc2.example.invalid
          ansible_port: 22
          ansible_user: cpadmin
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "{{ lookup('env', 'VIVO_EDGE_SSH_KEY') }}"
          ansible_ssh_common_args: >-
            -F /dev/null
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o 'UserKnownHostsFile="{{ inventory_dir }}/generated/known_hosts"'
            -o GlobalKnownHostsFile=/dev/null
          edge_public_ipv4: ''
          edge_private_ipv4: 10.20.2.5
          edge_slot: B
          edge_azure_dns_zone: acme-sbc2.voice.example.invalid
          edge_direct_predecessor_ansible_host: REPLACE_SBC2_SYNTHETIC_PREDECESSOR_HOST
          edge_direct_predecessor_generation: 0
          edge_direct_predecessor_ssh_port: 22
          edge_direct_predecessor_ansible_user: cpadmin
          edge_direct_predecessor_ssh_private_key_file: "{{ lookup('env', 'VIVO_EDGE_SSH_KEY') }}"
          edge_direct_predecessor_activation_sequence: 0
          edge_direct_predecessor_manifest_digest: sha256:REPLACE_SBC2_SYNTHETIC_MANIFEST_DIGEST
          edge_fixture_client_certificate_src: "{{ inventory_dir }}/generated/fixture/sbc2.crt"
          edge_fixture_client_key_src: "{{ inventory_dir }}/generated/fixture/sbc2.key"
          edge_fixture_client_certificate_sha256: REPLACE_SBC2_FIXTURE_CERT_SHA256
          edge_fixture_client_key_sha256: REPLACE_SBC2_FIXTURE_KEY_SHA256
          edge_signed_envelope_src: "{{ inventory_dir }}/generated/envelopes/sbc2.json"
          edge_signed_envelope_sha256: REPLACE_SBC2_ENVELOPE_SHA256
          edge_activation_sequence: 0
          edge_activation_manifest_digest: sha256:REPLACE_SBC2_MANIFEST_DIGEST
          edge_activation_recovery_node_id: REPLACE_SBC2_RECOVERY_NODE_ID
          edge_activation_recovery_sequence: 0
          edge_activation_recovery_manifest_digest: sha256:REPLACE_SBC2_RECOVERY_MANIFEST_DIGEST
