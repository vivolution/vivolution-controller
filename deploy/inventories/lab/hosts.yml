all:
  children:
    controllers:
      hosts:
        cp1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: cpadmin
          ansible_ssh_private_key_file: ~/.ssh/vivo_cp1_lab_ed25519
          ansible_ssh_common_args: >-
            -F /dev/null
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o 'UserKnownHostsFile="{{ inventory_dir }}/../../../lab/utm/generated/known_hosts"'
            -o GlobalKnownHostsFile=/dev/null
