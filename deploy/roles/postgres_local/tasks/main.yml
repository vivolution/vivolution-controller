---
- name: Find PostgreSQL 17 cluster configuration
  ansible.builtin.stat:
    path: /etc/postgresql/17/main/postgresql.conf
  register: cp_postgres_config

- name: Require PostgreSQL 17 cluster
  ansible.builtin.assert:
    that: cp_postgres_config.stat.exists
    fail_msg: Debian did not create the expected PostgreSQL 17 main cluster.

- name: Configure PostgreSQL listener and memory limits
  ansible.builtin.blockinfile:
    path: /etc/postgresql/17/main/postgresql.conf
    marker: '# {mark} VIVOLUTION CP1 MANAGED BLOCK'
    block: |
      listen_addresses = '127.0.0.1'
      password_encryption = 'scram-sha-256'
      shared_buffers = '{{ cp_postgres_shared_buffers }}'
      effective_cache_size = '{{ cp_postgres_effective_cache_size }}'
      max_connections = {{ cp_postgres_max_connections }}
      log_connections = on
      log_disconnections = on
  notify: Restart PostgreSQL

- name: Restrict local PostgreSQL host authentication
  ansible.builtin.copy:
    dest: /etc/postgresql/17/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
    content: |
      local   all             postgres                                peer
      local   all             all                                     peer
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             ::1/128                 reject
  notify: Reload PostgreSQL

- name: Ensure PostgreSQL is available before provisioning roles
  ansible.builtin.meta: flush_handlers

- name: Require PostgreSQL to accept local TCP connections
  ansible.builtin.command:
    argv:
      - pg_isready
      - --host=127.0.0.1
      - "--port={{ cp_db_upstream_port }}"
      - --dbname=postgres
  changed_when: false

- name: Test the desired owner password without changing its SCRAM verifier
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - --host=127.0.0.1
      - "--port={{ cp_db_upstream_port }}"
      - "--username={{ cp_db_owner }}"
      - --dbname=postgres
      - --no-password
      - --tuples-only
      - --command=SELECT 1
  environment:
    PGPASSWORD: "{{ cp_db_owner_password }}"
  register: cp_db_owner_password_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Test the desired runtime password without changing its SCRAM verifier
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - --host=127.0.0.1
      - "--port={{ cp_db_upstream_port }}"
      - "--username={{ cp_db_runtime_user }}"
      - --dbname=postgres
      - --no-password
      - --tuples-only
      - --command=SELECT 1
  environment:
    PGPASSWORD: "{{ cp_db_runtime_password }}"
  register: cp_db_runtime_password_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Provision local database roles and database safely
  block:
    - name: Render protected database bootstrap SQL
      ansible.builtin.template:
        src: bootstrap.sql.j2
        dest: /run/vivolution-db-bootstrap.sql
        owner: postgres
        group: postgres
        mode: '0600'
      changed_when: false
      no_log: true

    - name: Create or update local database roles and database
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -X
          - --set=ON_ERROR_STOP=1
          - --file=/run/vivolution-db-bootstrap.sql
      register: cp_db_bootstrap_result
      changed_when: >-
        'VIVOLUTION_DB_CHANGED:' in
        ((cp_db_bootstrap_result.stdout | default('')) ~
        (cp_db_bootstrap_result.stderr | default('')))
      no_log: true
  always:
    - name: Remove protected database bootstrap SQL
      ansible.builtin.file:
        path: /run/vivolution-db-bootstrap.sql
        state: absent
      changed_when: false
      no_log: true

- name: Prove the reconciled owner credential is accepted
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - --host=127.0.0.1
      - "--port={{ cp_db_upstream_port }}"
      - "--username={{ cp_db_owner }}"
      - "--dbname={{ cp_database_name }}"
      - --no-password
      - --tuples-only
      - --command=SELECT 1
  environment:
    PGPASSWORD: "{{ cp_db_owner_password }}"
  changed_when: false
  no_log: true

- name: Prove the reconciled runtime credential is accepted
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - --set=ON_ERROR_STOP=1
      - --host=127.0.0.1
      - "--port={{ cp_db_upstream_port }}"
      - "--username={{ cp_db_runtime_user }}"
      - "--dbname={{ cp_database_name }}"
      - --no-password
      - --tuples-only
      - --command=SELECT 1
  environment:
    PGPASSWORD: "{{ cp_db_runtime_password }}"
  changed_when: false
  no_log: true

- name: Enable PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql.service
    enabled: true
    state: started
