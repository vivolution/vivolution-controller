---
- name: Set controller hostname
  ansible.builtin.hostname:
    name: "{{ cp_expected_hostname }}"
    use: systemd

- name: Keep local hostname resolution consistent
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1\t{{ cp_expected_hostname }}"
    state: present

- name: Resolve the trusted ingress name through guest loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+\S+\s+# Vivolution CP1 ingress$'
    line: "127.0.0.1\t{{ cp_ingress_server_name }} # Vivolution CP1 ingress"
    state: present
  when: cp_ingress_loopback_resolution | default(true) | bool

- name: Apply available Debian upgrades without removals
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
    lock_timeout: 120

- name: Install controller foundation packages
  ansible.builtin.apt:
    name: "{{ cp_base_packages + (cp_lab_database_packages if cp_install_local_postgres | bool else []) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  vars:
    cp_base_packages:
      - acl
      - ca-certificates
      - curl
      - jq
      - nftables
      - openssl
      - pgbouncer
      - podman
      - postgresql-client-17
      - python3-psycopg
      - unattended-upgrades
    cp_lab_database_packages:
      - postgresql-17
      - postgresql-contrib-17

- name: Create Vivolution configuration directory
  ansible.builtin.file:
    path: /etc/vivolution
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create private Vivolution release configuration directory
  ansible.builtin.file:
    path: /etc/vivolution/releases
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create Vivolution state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - /var/lib/vivolution
    - /var/lib/vivolution/releases
    - /var/lib/vivolution/artifacts
    - /var/lib/vivolution/backups

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bound persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/20-vivolution-limits.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ cp_journal_max_use }}
      RuntimeMaxUse=64M
      MaxRetentionSec=14day
  notify: Restart journald

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52vivolution-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable periodic APT maintenance
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
