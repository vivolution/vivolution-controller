---
- name: Qualify the Django administrator login through trusted HTTPS
  hosts: controllers
  become: true
  gather_facts: false
  vars:
    cp_admin_host_helper_source: "{{ playbook_dir }}/../tests/admin-host-session-check.py"
    cp_admin_guest_ca_path: >-
      {{ cp_ingress_guest_ca_path |
         default('/usr/local/share/ca-certificates/vivolution-lab-caddy.crt') }}
    cp_admin_runner_ca_path: >-
      {{ cp_ingress_runner_ca_path |
         default(cp_ingress_ca_export_path |
         default(playbook_dir + '/../../lab/utm/generated/caddy-root.crt')) }}
    cp_admin_guest_connect_address: >-
      {{ cp_ingress_guest_connect_address | default('127.0.0.1') }}
    cp_admin_external_connect_address: >-
      {{ cp_ingress_external_connect_address | default('127.0.0.1') }}
    cp_admin_runner_https_port: >-
      {{ cp_resource_host_https_port | default(cp_ingress_https_port) }}
  tasks:
    - name: Validate administrator login qualification variables
      ansible.builtin.assert:
        that:
          - cp_controller_admin_username is defined
          - cp_controller_admin_username | length > 0
          - cp_controller_admin_password is defined
          - cp_controller_admin_password | length > 0
          - cp_ingress_server_name is defined
          - cp_ingress_server_name | length > 0
          - cp_ingress_https_port is defined
          - cp_ingress_https_port | int >= 1
          - cp_ingress_https_port | int <= 65535
          - cp_ingress_local_tls is defined
          - cp_admin_guest_ca_path is string
          - cp_admin_guest_ca_path is match('^/.+')
          - cp_admin_runner_ca_path is string
          - cp_admin_runner_ca_path is match('^/.+')
          - cp_admin_guest_connect_address is string
          - cp_admin_guest_connect_address is match('^[0-9A-Fa-f:.]{2,45}$')
          - cp_admin_external_connect_address is string
          - cp_admin_external_connect_address is match('^[0-9A-Fa-f:.]{2,45}$')
          - cp_admin_runner_https_port | int >= 1
          - cp_admin_runner_https_port | int <= 65535
          - >-
            (cp_ingress_local_tls | bool) or
            (cp_ingress_guest_ca_path is defined and
             cp_ingress_runner_ca_path is defined and
             cp_ingress_guest_connect_address is defined and
             cp_ingress_external_connect_address is defined)
          - >-
            (cp_ingress_local_tls | bool) or
            cp_admin_external_connect_address != cp_admin_guest_connect_address
        fail_msg: Administrator credentials and the trusted HTTPS endpoint are required.
      no_log: true

    - name: Inspect the guest HTTPS trust anchor
      ansible.builtin.stat:
        path: "{{ cp_admin_guest_ca_path }}"
        follow: false
      register: cp_admin_guest_ca

    - name: Require a regular guest HTTPS trust anchor
      ansible.builtin.assert:
        that:
          - cp_admin_guest_ca.stat.exists
          - cp_admin_guest_ca.stat.isreg | default(false)
          - not (cp_admin_guest_ca.stat.islnk | default(false))
          - cp_admin_guest_ca.stat.uid | int == 0
          - cp_admin_guest_ca.stat.gid | int == 0
          - cp_admin_guest_ca.stat.mode == '0644'
        fail_msg: The trusted guest HTTPS CA is unavailable or unsafe.

    - name: Create protected guest administrator acceptance workspace
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: vivolution-admin-guest-
      register: cp_admin_guest_workspace
      no_log: true

    - name: Run protected guest administrator acceptance
      block:
        - name: Install ephemeral guest administrator acceptance helper
          ansible.builtin.copy:
            src: "{{ cp_admin_host_helper_source }}"
            dest: "{{ cp_admin_guest_workspace.path }}/admin-session-check.py"
            owner: root
            group: root
            mode: '0700'

        - name: Authenticate through guest loopback with hostname-verified TLS
          ansible.builtin.command:
            argv:
              - python3
              - "{{ cp_admin_guest_workspace.path }}/admin-session-check.py"
            stdin: >-
              {{ {
                'server_name': cp_ingress_server_name,
                'connect_address': cp_admin_guest_connect_address,
                'port': cp_ingress_https_port | int,
                'ca_path': cp_admin_guest_ca_path,
                'username': cp_controller_admin_username,
                'password': cp_controller_admin_password
              } | to_json }}
            stdin_add_newline: true
          register: cp_admin_guest_probe
          changed_when: false
          failed_when: false
          no_log: true

        - name: Require structured guest administrator acceptance output
          ansible.builtin.assert:
            that:
              - cp_admin_guest_probe.stdout is defined
              - cp_admin_guest_probe.stdout.startswith('{')
            fail_msg: Guest administrator acceptance did not return a sanitized result.
          no_log: true

        - name: Parse sanitized guest administrator acceptance result
          ansible.builtin.set_fact:
            cp_admin_guest_result: "{{ cp_admin_guest_probe.stdout | from_json }}"
          no_log: true

        - name: Require a closed authenticated guest administrator session
          ansible.builtin.assert:
            that:
              - cp_admin_guest_probe.rc == 0
              - cp_admin_guest_result.status == 'passed'
              - cp_admin_guest_result.reason == 'authenticated_session_closed'
            fail_msg: >-
              Guest administrator acceptance failed with the sanitized reason
              {{ cp_admin_guest_result.reason | default('unknown') }}.

        - name: Remember sanitized guest administrator acceptance
          ansible.builtin.set_fact:
            cp_admin_guest_session_passed: true
      always:
        - name: Remove guest administrator acceptance workspace
          ansible.builtin.file:
            path: "{{ cp_admin_guest_workspace.path }}"
            state: absent
          when:
            - cp_admin_guest_workspace is defined
            - cp_admin_guest_workspace.path is defined
          no_log: true

    - name: Require completed guest administrator acceptance
      ansible.builtin.assert:
        that:
          - cp_admin_guest_session_passed | default(false) | bool
        fail_msg: The guest administrator acceptance did not complete.

    - name: Exercise the administrator session from the Ansible controller
      run_once: true
      block:
        - name: Validate runner administrator qualification variables
          ansible.builtin.assert:
            that:
              - >-
                (not (cp_ingress_local_tls | bool)) or ansible_host == '127.0.0.1'
              - >-
                (not (cp_ingress_local_tls | bool)) or
                cp_admin_external_connect_address == '127.0.0.1'
              - cp_admin_runner_https_port | int >= 1
              - cp_admin_runner_https_port | int <= 65535
              - >-
                (cp_ingress_local_tls | bool) or
                cp_admin_runner_https_port | int == cp_ingress_https_port | int
              - cp_admin_runner_ca_path is string
              - cp_admin_runner_ca_path | length > 0
            fail_msg: The runner HTTPS address, port, or trust anchor is invalid.

        - name: Inspect HTTPS trust anchor on the Ansible controller
          ansible.builtin.stat:
            path: "{{ cp_admin_runner_ca_path }}"
          delegate_to: localhost
          become: false
          register: cp_admin_runner_ca

        - name: Require a regular runner HTTPS trust anchor
          ansible.builtin.assert:
            that:
              - cp_admin_runner_ca.stat.exists
              - cp_admin_runner_ca.stat.isreg | default(false)
            fail_msg: The HTTPS CA is unavailable on the Ansible controller.

        - name: Create protected host administrator acceptance workspace
          ansible.builtin.tempfile:
            state: directory
            prefix: vivolution-admin-host-
          delegate_to: localhost
          become: false
          register: cp_admin_host_workspace
          no_log: true

        - name: Run protected runner administrator acceptance
          block:
            - name: Install ephemeral host administrator acceptance helper
              ansible.builtin.copy:
                src: "{{ cp_admin_host_helper_source }}"
                dest: "{{ cp_admin_host_workspace.path }}/admin-host-session-check.py"
                mode: '0700'
              delegate_to: localhost
              become: false

            - name: Authenticate through the pinned address with hostname-verified TLS
              ansible.builtin.command:
                argv:
                  - python3
                  - "{{ cp_admin_host_workspace.path }}/admin-host-session-check.py"
                stdin: >-
                  {{ {
                    'server_name': cp_ingress_server_name,
                    'connect_address': cp_admin_external_connect_address,
                    'port': cp_admin_runner_https_port | int,
                    'ca_path': cp_admin_runner_ca_path,
                    'username': cp_controller_admin_username,
                    'password': cp_controller_admin_password
                  } | to_json }}
                stdin_add_newline: true
              delegate_to: localhost
              become: false
              register: cp_admin_host_probe
              changed_when: false
              failed_when: false
              no_log: true

            - name: Require structured host administrator acceptance output
              ansible.builtin.assert:
                that:
                  - cp_admin_host_probe.stdout is defined
                  - cp_admin_host_probe.stdout.startswith('{')
                fail_msg: Host administrator acceptance did not return a sanitized result.
              no_log: true

            - name: Parse sanitized host administrator acceptance result
              ansible.builtin.set_fact:
                cp_admin_host_result: "{{ cp_admin_host_probe.stdout | from_json }}"
              no_log: true

            - name: Require a closed authenticated host administrator session
              ansible.builtin.assert:
                that:
                  - cp_admin_host_probe.rc == 0
                  - cp_admin_host_result.status == 'passed'
                  - cp_admin_host_result.reason == 'authenticated_session_closed'
                fail_msg: >-
                  Host-forwarded administrator acceptance failed with the sanitized reason
                  {{ cp_admin_host_result.reason | default('unknown') }}.

            - name: Remember sanitized host administrator acceptance
              ansible.builtin.set_fact:
                cp_admin_host_session_passed: true
          always:
            - name: Remove host administrator acceptance workspace
              ansible.builtin.file:
                path: "{{ cp_admin_host_workspace.path }}"
                state: absent
              delegate_to: localhost
              become: false
              when:
                - cp_admin_host_workspace is defined
                - cp_admin_host_workspace.path is defined
              no_log: true

        - name: Require completed host administrator acceptance
          ansible.builtin.assert:
            that:
              - cp_admin_host_session_passed | default(false) | bool
            fail_msg: The runner administrator acceptance did not complete.

        - name: Report sanitized runner administrator qualification result
          ansible.builtin.debug:
            msg: >-
              {{ 'host_forwarded_admin_login=passed'
                 if cp_ingress_local_tls | bool
                 else 'public_static_address_admin_login=passed' }}

    - name: Report administrator login qualification result
      ansible.builtin.debug:
        msg: admin_login=passed
