---
- name: Qualify secret non-exposure and record component inventory
  hosts: controllers
  become: true
  gather_facts: false
  vars:
    cp_secret_scanner_source: "{{ playbook_dir }}/../tests/secret-surface-scan.py"
    cp_secret_project_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Require protected qualification variables
      ansible.builtin.assert:
        that:
          - cp_db_owner_password is defined
          - cp_db_runtime_password is defined
          - cp_rls_context_key is defined
          - cp_django_secret_key is defined
          - cp_controller_admin_password is defined
        fail_msg: Invoke this gate through the protected playbook wrapper.

    - name: Scan project source and prior evidence without exposing secret values
      ansible.builtin.command:
        argv:
          - python3
          - "{{ cp_secret_scanner_source }}"
          - local
          - --project-root
          - "{{ cp_secret_project_root }}"
        stdin: >-
          {{ {
            'cp_db_owner_password': cp_db_owner_password,
            'cp_db_runtime_password': cp_db_runtime_password,
            'cp_rls_context_key': cp_rls_context_key,
            'cp_django_secret_key': cp_django_secret_key,
            'cp_controller_admin_password': cp_controller_admin_password
          } | to_json }}
        stdin_add_newline: true
      delegate_to: localhost
      become: false
      register: cp_secret_local_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require structured local scan output
      ansible.builtin.assert:
        that:
          - cp_secret_local_raw.stdout is defined
          - cp_secret_local_raw.stdout.startswith('{')
        fail_msg: Local secret scanning did not return structured sanitized results.

    - name: Parse protected local scan output
      ansible.builtin.set_fact:
        cp_secret_local: "{{ cp_secret_local_raw.stdout | from_json }}"
      no_log: true

    - name: Create protected remote audit workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: vivo-secret-inventory-
      register: cp_secret_remote_workspace

    - name: Collect and scan remote surfaces
      block:
        - name: Install ephemeral scanner helper
          ansible.builtin.copy:
            src: "{{ cp_secret_scanner_source }}"
            dest: "{{ cp_secret_remote_workspace.path }}/secret-surface-scan.py"
            owner: root
            group: root
            mode: '0700'

        - name: Read exact active controller image ID
          ansible.builtin.command:
            argv:
              - podman
              - inspect
              - vivolution-cp-web
              - --format
              - "{{ '{{' }}.Image{{ '}}' }}"
          register: cp_secret_active_image
          changed_when: false

        - name: Require an immutable active image ID and configured base digest
          ansible.builtin.assert:
            that:
              - cp_secret_active_image.stdout is regex('^(sha256:)?[0-9a-f]{64}$')
              - cp_controller_base_image is regex('^.+@sha256:[0-9a-f]{64}$')
            fail_msg: Active or base controller image is not digest-addressed.

        - name: Capture image history into protected audit workspace
          ansible.builtin.shell:
            cmd: |
              set -eu
              umask 077
              podman history --no-trunc "$CP_SECRET_IMAGE" > "$CP_SECRET_DIR/image-history.txt"
            executable: /bin/sh
          environment:
            CP_SECRET_IMAGE: "{{ cp_secret_active_image.stdout }}"
            CP_SECRET_DIR: "{{ cp_secret_remote_workspace.path }}"
          changed_when: false
          no_log: true

        - name: Save active OCI image into protected audit workspace
          ansible.builtin.command:
            argv:
              - podman
              - save
              - --format
              - oci-archive
              - --output
              - "{{ cp_secret_remote_workspace.path }}/controller-image.oci"
              - "{{ cp_secret_active_image.stdout }}"
          changed_when: false
          no_log: true

        - name: Capture relevant service journals into protected audit workspace
          ansible.builtin.shell:
            cmd: |
              set -eu
              umask 077
              journalctl --no-pager --output=cat \
                --unit=vivolution-cp-web.service \
                --unit=caddy.service \
                --unit=pgbouncer.service \
                --unit=postgresql.service \
                --unit=postgresql@17-main.service \
                > "$CP_SECRET_DIR/service-journals.txt"
            executable: /bin/sh
          environment:
            CP_SECRET_DIR: "{{ cp_secret_remote_workspace.path }}"
          changed_when: false
          no_log: true

        - name: Scan image metadata, layers, process argv, and service journals
          ansible.builtin.command:
            argv:
              - python3
              - "{{ cp_secret_remote_workspace.path }}/secret-surface-scan.py"
              - remote
              - --image-archive
              - "{{ cp_secret_remote_workspace.path }}/controller-image.oci"
              - --image-history
              - "{{ cp_secret_remote_workspace.path }}/image-history.txt"
              - --service-journals
              - "{{ cp_secret_remote_workspace.path }}/service-journals.txt"
            stdin: >-
              {{ {
              'cp_db_owner_password': cp_db_owner_password,
              'cp_db_runtime_password': cp_db_runtime_password,
              'cp_rls_context_key': cp_rls_context_key,
              'cp_django_secret_key': cp_django_secret_key,
                'cp_controller_admin_password': cp_controller_admin_password
              } | to_json }}
            stdin_add_newline: true
          register: cp_secret_remote_raw
          changed_when: false
          failed_when: false
          no_log: true
      always:
        - name: Remove protected remote audit workspace
          ansible.builtin.file:
            path: "{{ cp_secret_remote_workspace.path }}"
            state: absent

    - name: Require structured remote scan output
      ansible.builtin.assert:
        that:
          - cp_secret_remote_raw.stdout is defined
          - cp_secret_remote_raw.stdout.startswith('{')
        fail_msg: Remote secret scanning did not return structured sanitized results.

    - name: Parse protected remote scan output
      ansible.builtin.set_fact:
        cp_secret_remote: "{{ cp_secret_remote_raw.stdout | from_json }}"
      no_log: true

    - name: Require complete secret scan coverage
      ansible.builtin.assert:
        that:
          - cp_secret_local_raw.rc is defined
          - cp_secret_remote_raw.rc is defined
          - cp_secret_local_raw.rc == 0
          - cp_secret_remote_raw.rc == 0
          - cp_secret_local.status == 'passed'
          - cp_secret_remote.status == 'passed'
          - cp_secret_local.coverage_errors | length == 0
          - cp_secret_remote.coverage_errors | length == 0
        fail_msg: >-
          Secret scan coverage was incomplete. Local safe errors={{ cp_secret_local.coverage_errors | to_json }};
          remote safe errors={{ cp_secret_remote.coverage_errors | to_json }}.

    - name: Require zero protected-value findings
      ansible.builtin.assert:
        that:
          - cp_secret_local.findings | length == 0
          - cp_secret_remote.findings | length == 0
        fail_msg: >-
          Protected-value exposure detected. Findings identify only variable, surface, and safe path:
          {{ (cp_secret_local.findings + cp_secret_remote.findings) | to_json }}

    - name: Read digest-pinned controller base declaration
      ansible.builtin.command:
        argv:
          - awk
          - '/^FROM[[:space:]]/ { print; exit }'
          - "{{ cp_secret_project_root }}/controller/Containerfile"
      delegate_to: localhost
      become: false
      register: cp_component_base_declaration
      changed_when: false

    - name: Require source and inventory to declare the same base digest
      ansible.builtin.assert:
        that:
          - cp_component_base_declaration.stdout is regex('^FROM .+@sha256:[0-9a-f]{64}$')
          - >-
            (cp_component_base_declaration.stdout | regex_search('@sha256:[0-9a-f]{64}$')) ==
            (cp_controller_base_image | regex_search('@sha256:[0-9a-f]{64}$'))
        fail_msg: Controller source and inventory disagree on the digest-pinned base image.

    - name: Record active controller image metadata
      ansible.builtin.command:
        argv:
          - podman
          - image
          - inspect
          - "{{ cp_secret_active_image.stdout }}"
          - --format
          - "{{ '{{' }}.Id{{ '}}' }}|{{ '{{' }}.Os{{ '}}' }}|{{ '{{' }}.Architecture{{ '}}' }}|{{ '{{' }}.Created{{ '}}' }}"
      register: cp_component_image
      changed_when: false

    - name: Record guest OS release inventory
      ansible.builtin.command:
        argv: [cat, /etc/os-release]
      register: cp_component_os_release
      changed_when: false

    - name: Record guest kernel inventory
      ansible.builtin.command:
        argv: [uname, --kernel-release]
      register: cp_component_kernel
      changed_when: false

    - name: Record installed Debian component inventory
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - '--showformat=${binary:Package}\t${Version}\t${Architecture}\n'
      register: cp_component_debian_packages
      changed_when: false

    - name: Record controller Python component inventory
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - vivolution-cp-web
          - python
          - -m
          - pip
          - list
          - --format=json
          - --disable-pip-version-check
      register: cp_component_python_packages
      changed_when: false

    - name: Require parseable controller Python inventory
      ansible.builtin.assert:
        that:
          - cp_component_python_packages.stdout | from_json | length > 0
        fail_msg: Controller Python component inventory was empty or invalid.

    - name: Detect supported vulnerability scanners on controller
      ansible.builtin.shell:
        cmd: |
          for scanner in trivy grype osv-scanner; do
            if command -v "$scanner" >/dev/null 2>&1; then
              printf '%s\n' "$scanner"
            fi
          done
        executable: /bin/sh
      register: cp_component_remote_scanners
      changed_when: false

    - name: Detect supported vulnerability scanners on control host
      ansible.builtin.shell:
        cmd: |
          for scanner in trivy grype osv-scanner; do
            if command -v "$scanner" >/dev/null 2>&1; then
              printf '%s\n' "$scanner"
            fi
          done
        executable: /bin/sh
      delegate_to: localhost
      become: false
      register: cp_component_local_scanners
      changed_when: false

    - name: Record sanitized secret and component qualification evidence
      ansible.builtin.debug:
        msg:
          - "secret_non_exposure=passed"
          - "local_files_scanned={{ cp_secret_local.scanned_files }}"
          - "local_bytes_scanned={{ cp_secret_local.scanned_bytes }}"
          - "remote_files_scanned={{ cp_secret_remote.scanned_files }}"
          - "remote_bytes_scanned={{ cp_secret_remote.scanned_bytes }}"
          - "active_controller_image={{ cp_component_image.stdout }}"
          - "configured_base_image={{ cp_controller_base_image }}"
          - "containerfile_base_declaration={{ cp_component_base_declaration.stdout }}"
          - "guest_kernel={{ cp_component_kernel.stdout }}"
          - "guest_os_release={{ cp_component_os_release.stdout_lines | to_json }}"
          - "guest_debian_packages={{ cp_component_debian_packages.stdout_lines | sort | to_json }}"
          - "controller_python_packages={{ cp_component_python_packages.stdout | from_json | sort(attribute='name') | to_json }}"
          - >-
            vulnerability_scanners_control_host={{
              (cp_component_local_scanners.stdout_lines | join(','))
              if cp_component_local_scanners.stdout_lines | length > 0 else 'none' }}
          - >-
            vulnerability_scanners_controller={{
              (cp_component_remote_scanners.stdout_lines | join(','))
              if cp_component_remote_scanners.stdout_lines | length > 0 else 'none' }}
          - "vulnerability_scan_status=separate_required_gate"
          - >-
            vulnerability_scan_reason={{
              'no supported vulnerability scanner is installed; cpctl qualification must fail its separate scan gate'
              if ((cp_component_local_scanners.stdout_lines | length == 0) and
                  (cp_component_remote_scanners.stdout_lines | length == 0))
              else 'component inventory is not a scan; cpctl qualification runs the exact-image scanner separately' }}
