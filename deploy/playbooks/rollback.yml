---
- name: Roll back Vivolution CP1 application release
  hosts: controllers
  become: true
  gather_facts: true
  tasks:
    - name: Inspect previous release marker
      ansible.builtin.stat:
        path: /etc/vivolution/previous-release
        follow: false
      register: cp_previous_release_marker_stat

    - name: Require a safe previous release marker
      ansible.builtin.assert:
        that:
          - cp_previous_release_marker_stat.stat.isreg | default(false)
          - not (cp_previous_release_marker_stat.stat.islnk | default(false))
          - cp_previous_release_marker_stat.stat.uid | default(-1) | int == 0
          - cp_previous_release_marker_stat.stat.gid | default(-1) | int == 0
          - cp_previous_release_marker_stat.stat.mode | default('') == '0644'
          - cp_previous_release_marker_stat.stat.nlink | default(-1) | int == 1
        fail_msg: No safe previous controller release marker is available.

    - name: Read previous release marker
      ansible.builtin.slurp:
        src: /etc/vivolution/previous-release
      register: cp_previous_release_file

    - name: Select previous release
      ansible.builtin.set_fact:
        cp_controller_release_id: "{{ cp_previous_release_file.content | b64decode | trim }}"
        cp_controller_build: false
        cp_controller_refresh_release_environment: false
        cp_controller_run_migrations: false
        cp_controller_create_initial_operator: false
        cp_controller_allow_legacy_rls_rollback: true

    - name: Validate rollback release identifier
      ansible.builtin.assert:
        that: cp_controller_release_id is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]{7,79}$')
        fail_msg: No valid previous controller release is available.

    - name: Activate previous controller release
      ansible.builtin.include_role:
        name: controller_services
