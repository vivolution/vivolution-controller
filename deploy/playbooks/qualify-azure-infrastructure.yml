---
- name: Qualify the read-only Azure infrastructure contract
  hosts: controllers
  become: false
  gather_facts: false
  tasks:
    - name: End infrastructure qualification outside the Azure single-node profile
      ansible.builtin.meta: end_host
      when: cp_profile | default('') != 'azure-single'

    - name: Audit the Azure control plane without mutation
      delegate_to: localhost
      run_once: true
      block:
        - name: Select the explicit Azure infrastructure topology
          ansible.builtin.set_fact:
            cp_azure_infrastructure_topology_selected: >-
              {{ cp_azure_infrastructure_topology |
                 default('legacy-single-node', true) }}

        - name: Require one supported Azure infrastructure topology
          ansible.builtin.assert:
            that:
              - >-
                cp_azure_infrastructure_topology_selected in
                ['legacy-single-node', 'poc-three-node']
            fail_msg: >-
              cp_azure_infrastructure_topology must be explicitly supported;
              only legacy-single-node and poc-three-node are qualified.

        - name: Require explicit Azure infrastructure inventory variables
          ansible.builtin.assert:
            that:
              - cp_azure_subscription_id is defined
              - cp_azure_tenant_id is defined
              - cp_azure_resource_group is defined
              - cp_azure_location is defined
              - cp_azure_vm_name is defined
              - cp_azure_vm_size is defined
              - cp_azure_vm_image_publisher is defined
              - cp_azure_vm_image_offer is defined
              - cp_azure_vm_image_sku is defined
              - cp_azure_vm_image_version is defined
              - cp_azure_os_disk_name is defined
              - cp_azure_os_disk_size_gb is defined
              - cp_azure_os_disk_sku is defined
              - cp_azure_public_ip_name is defined
              - cp_azure_public_ip is defined
              - cp_azure_public_ip_dns_label is defined
              - cp_azure_nsg_name is defined
              - cp_azure_nic_name is defined
              - cp_azure_nic_ip_configuration_name is defined
              - cp_azure_private_ip is defined
              - cp_azure_private_ip_allocation_method is defined
              - cp_azure_vnet_name is defined
              - cp_azure_vnet_address_prefix is defined
              - cp_azure_subnet_name is defined
              - cp_azure_subnet_address_prefix is defined
              - cp_azure_ssh_source_prefixes is defined
              - cp_firewall_ssh_source_ipv4_cidrs is defined
              - cp_azure_dns_zone_name is defined
              - cp_azure_dns_zone_resource_group is defined
              - cp_azure_dns_record_name is defined
              - cp_ingress_server_name is defined
              - cp_ingress_external_connect_address is defined
              - cp_qualification_https_connect_address is defined
            fail_msg: >-
              Azure infrastructure qualification requires every subscription,
              resource, image, network, and DNS identity to be explicit in the
              protected inventory.

        - name: Require explicit three-node POC infrastructure variables
          ansible.builtin.assert:
            that:
              - cp_azure_poc_edge_availability_set_name is defined
              - cp_azure_poc_edge_subnet_name is defined
              - cp_azure_poc_edge_subnet_address_prefix is defined
              - cp_azure_poc_edge_nodes is defined
              - cp_azure_poc_microsoft_signaling_source_prefixes is defined
              - cp_azure_poc_microsoft_media_source_prefixes is defined
              - cp_azure_poc_synthetic_teams_source_prefixes is defined
              - cp_azure_poc_rtp_media_port_range is defined
              - cp_azure_poc_tenant_media_port_range is defined
              - cp_azure_poc_pbx_tls_listener_port is defined
              - cp_azure_poc_edge_runtime_profile is defined
            fail_msg: >-
              The three-node POC topology requires every Edge identity,
              subnet, source allow-list, and bounded signaling/media range to
              be explicit in the protected inventory.
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Validate the immutable Azure infrastructure contract
          ansible.builtin.assert:
            that:
              - cp_azure_subscription_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
              - cp_azure_tenant_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
              - cp_azure_resource_group is match('^[A-Za-z0-9._()/-]{1,90}$')
              - cp_azure_location == 'uaenorth'
              - cp_azure_vm_name is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,63}$')
              - cp_azure_vm_size == 'Standard_D2as_v5'
              - cp_azure_vm_image_publisher == 'Debian'
              - cp_azure_vm_image_offer == 'debian-13'
              - cp_azure_vm_image_sku == '13-gen2'
              - cp_azure_vm_image_version != 'latest'
              - cp_azure_vm_image_version is match('^[0-9][0-9A-Za-z._-]+$')
              - cp_azure_os_disk_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
              - cp_azure_os_disk_size_gb | int == 64
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_os_disk_sku == 'Premium_LRS') or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 cp_azure_os_disk_sku == 'StandardSSD_LRS')
              - cp_azure_public_ip_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
              - cp_azure_public_ip is match(cp_azure_ipv4_pattern)
              - cp_azure_public_ip_dns_label is none
              - cp_azure_nsg_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
              - cp_azure_nic_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
              - cp_azure_nic_ip_configuration_name == 'ipconfig1'
              - cp_azure_private_ip == '10.20.1.4'
              - cp_azure_private_ip is match(cp_azure_ipv4_pattern)
              - cp_azure_private_ip_allocation_method == 'Static'
              - cp_azure_vnet_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
              - cp_azure_vnet_address_prefix == '10.20.0.0/16'
              - cp_azure_subnet_name is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$')
              - cp_azure_subnet_address_prefix == '10.20.1.0/24'
              - cp_azure_ssh_source_prefixes is sequence
              - cp_azure_ssh_source_prefixes is not string
              - cp_azure_ssh_source_prefixes | length >= 1
              - cp_azure_ssh_source_prefixes | length <= 4
              - >-
                cp_azure_ssh_source_prefixes | unique | length ==
                cp_azure_ssh_source_prefixes | length
              - cp_azure_dns_zone_name is match('^[a-z0-9.-]+$')
              - cp_azure_dns_zone_resource_group is match('^[A-Za-z0-9._()/-]{1,90}$')
              - cp_azure_dns_record_name is match('^[a-z0-9-]{1,63}$')
              - >-
                cp_ingress_server_name ==
                cp_azure_dns_record_name ~ '.' ~ cp_azure_dns_zone_name
              - cp_azure_public_ip == cp_ingress_external_connect_address
              - cp_azure_public_ip == cp_qualification_https_connect_address
              - >-
                cp_azure_ssh_source_prefixes | sort ==
                cp_firewall_ssh_source_ipv4_cidrs | sort
            fail_msg: >-
              Azure inventory values do not declare the approved UAE North,
              D2as_v5, pinned Debian 13 Gen2, or topology-specific OS-disk
              contract.
          vars:
            cp_azure_ipv4_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$'

        - name: Validate the immutable three-node POC identity contract
          ansible.builtin.assert:
            that:
              - cp_azure_vm_name == 'viv-sbc-poc-cp1'
              - cp_azure_os_disk_name == 'viv-sbc-poc-cp1-osdisk'
              - cp_azure_public_ip_name == 'viv-sbc-poc-cp1-pip'
              - cp_azure_nsg_name == 'viv-sbc-poc-cp1-nsg'
              - cp_azure_nic_name == 'viv-sbc-poc-cp1-nic'
              - cp_azure_vnet_name == 'viv-sbc-poc-vnet'
              - cp_azure_subnet_name == 'snet-management'
              - cp_azure_poc_edge_subnet_name == 'snet-edge'
              - cp_azure_poc_edge_subnet_address_prefix == '10.20.2.0/24'
              - cp_azure_poc_edge_availability_set_name == 'viv-sbc-poc-edge-as'
              - cp_azure_poc_edge_nodes is sequence
              - cp_azure_poc_edge_nodes is not string
              - cp_azure_poc_edge_nodes | length == 2
              - >-
                cp_azure_poc_edge_nodes | map(attribute='role') | list ==
                ['sbc1', 'sbc2']
              - cp_azure_poc_microsoft_signaling_source_prefixes is sequence
              - cp_azure_poc_microsoft_signaling_source_prefixes is not string
              - >-
                cp_azure_poc_microsoft_signaling_source_prefixes | sort ==
                ['52.112.0.0/14', '52.120.0.0/14']
              - cp_azure_poc_microsoft_media_source_prefixes is sequence
              - cp_azure_poc_microsoft_media_source_prefixes is not string
              - >-
                cp_azure_poc_microsoft_media_source_prefixes | sort ==
                ['52.112.0.0/14', '52.120.0.0/14']
              - cp_azure_poc_synthetic_teams_source_prefixes is sequence
              - cp_azure_poc_synthetic_teams_source_prefixes is not string
              - >-
                (cp_azure_poc_edge_runtime_profile == 'SYNTHETIC_PRIVATE' and
                 cp_azure_poc_synthetic_teams_source_prefixes == ['10.20.1.4/32']) or
                (cp_azure_poc_edge_runtime_profile == 'DIRECT_ROUTING' and
                 cp_azure_poc_synthetic_teams_source_prefixes | length == 0)
              - cp_azure_poc_rtp_media_port_range == '20000-29999'
              - cp_azure_poc_tenant_media_port_range == '20000-20255'
              - cp_azure_poc_pbx_tls_listener_port | int == 15061
              - >-
                cp_azure_poc_edge_runtime_profile in
                ['SYNTHETIC_PRIVATE', 'DIRECT_ROUTING']
            fail_msg: >-
              The three-node POC inventory diverges from the fixed Bicep
              naming, subnet, or bounded media contract.
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Validate each immutable POC Edge-node identity
          ansible.builtin.assert:
            that:
              - >-
                item.keys() | list | sort ==
                ['nic_name', 'nsg_name', 'os_disk_name', 'os_disk_size_gb',
                 'pbx_media_destination_port_end',
                 'pbx_media_destination_port_start', 'pbx_source_prefixes',
                 'private_ip', 'public_ip',
                 'public_ip_name', 'role', 'vm_name', 'vm_size'] | sort
              - item.vm_name == 'viv-sbc-poc-' ~ item.role
              - item.vm_size == 'Standard_B2als_v2'
              - item.os_disk_name == item.vm_name ~ '-osdisk'
              - item.os_disk_size_gb | int == 32
              - item.public_ip_name == item.vm_name ~ '-pip'
              - item.nsg_name == item.vm_name ~ '-nsg'
              - item.nic_name == item.vm_name ~ '-nic'
              - item.public_ip is match(cp_azure_ipv4_pattern)
              - >-
                (item.role == 'sbc1' and item.private_ip == '10.20.2.4') or
                (item.role == 'sbc2' and item.private_ip == '10.20.2.5')
              - item.pbx_source_prefixes is sequence
              - item.pbx_source_prefixes is not string
              - item.pbx_source_prefixes | length >= 1
              - item.pbx_source_prefixes | length <= 16
              - item.pbx_media_destination_port_start is number
              - item.pbx_media_destination_port_end is number
              - item.pbx_media_destination_port_start | int >= 1024
              - item.pbx_media_destination_port_end | int <= 65535
              - item.pbx_media_destination_port_start | int % 2 == 0
              - item.pbx_media_destination_port_end | int % 2 == 1
              - item.pbx_media_destination_port_start | int <= item.pbx_media_destination_port_end | int
              - item.pbx_media_destination_port_end | int - item.pbx_media_destination_port_start | int + 1 <= 4096
              - >-
                not (item.pbx_media_destination_port_start | int <= 2223 and
                     item.pbx_media_destination_port_end | int >= 2223)
              - >-
                not (item.pbx_media_destination_port_start | int <= 2224 and
                     item.pbx_media_destination_port_end | int >= 2224)
              - >-
                not (item.pbx_media_destination_port_start | int <= 5061 and
                     item.pbx_media_destination_port_end | int >= 5061)
              - >-
                not (item.pbx_media_destination_port_start | int <= 15061 and
                     item.pbx_media_destination_port_end | int >= 15061)
              - >-
                item.pbx_source_prefixes | unique | length ==
                item.pbx_source_prefixes | length
              - >-
                (cp_azure_poc_edge_runtime_profile == 'SYNTHETIC_PRIVATE' and
                 item.pbx_source_prefixes == ['10.20.1.4/32'] and
                 item.pbx_media_destination_port_start | int == 21000 and
                 item.pbx_media_destination_port_end | int == 21127) or
                (cp_azure_poc_edge_runtime_profile == 'DIRECT_ROUTING' and
                 '10.20.1.4/32' not in item.pbx_source_prefixes and
                 item.pbx_media_destination_port_end | int -
                 item.pbx_media_destination_port_start | int + 1 >= 100 and
                 not (item.pbx_media_destination_port_start | int == 21000 and
                      item.pbx_media_destination_port_end | int == 21127))
            fail_msg: >-
              A POC Edge node does not match its fixed VM, disk, NIC, NSG,
              public-IP, private-IP, size, or PBX-source identity.
          loop: "{{ cp_azure_poc_edge_nodes | default([]) }}"
          loop_control:
            label: "{{ item.role | default('invalid-edge-node') }}"
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'
          vars:
            cp_azure_ipv4_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$'

        - name: Require globally routable bounded PBX CIDRs for Direct Routing
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -c
              - >-
                import ipaddress, json, sys;
                groups = json.loads(sys.argv[1]);
                networks = [ipaddress.ip_network(cidr, strict=True)
                for group in groups for cidr in group];
                sys.exit(0 if networks and all(network.version == 4 and
                network.prefixlen >= 24 and network.network_address.is_global
                for network in networks) else 1)
              - >-
                {{ cp_azure_poc_edge_nodes |
                   map(attribute='pbx_source_prefixes') | list | to_json }}
          changed_when: false
          check_mode: false
          when:
            - cp_azure_infrastructure_topology_selected == 'poc-three-node'
            - cp_azure_poc_edge_runtime_profile == 'DIRECT_ROUTING'

        - name: Validate every approved SSH source as one IPv4 host
          ansible.builtin.assert:
            that:
              - item is match(cp_azure_ipv4_host_cidr_pattern)
            fail_msg: Every approved Azure SSH source must be one explicit IPv4 /32.
          loop: "{{ cp_azure_ssh_source_prefixes }}"
          loop_control:
            label: approved-ipv4-host
          vars:
            cp_azure_ipv4_host_cidr_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})/32$'

        - name: Read the official Azure CLI version
          ansible.builtin.command:
            argv:
              - az
              - version
              - --output
              - json
          environment: &azure_cli_environment
            AZURE_CORE_COLLECT_TELEMETRY: 'false'
            AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
            AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
          register: cp_azure_cli_version_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure CLI version
          ansible.builtin.set_fact:
            cp_azure_cli_version: >-
              {{ (cp_azure_cli_version_raw.stdout | from_json)['azure-cli'] }}

        - name: Read the selected Azure subscription identity
          ansible.builtin.command:
            argv:
              - az
              - account
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --query
              - '{id:id,state:state,tenantId:tenantId}'
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_account_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure subscription identity
          ansible.builtin.set_fact:
            cp_azure_account: "{{ cp_azure_account_raw.stdout | from_json }}"

        - name: Require the exact enabled Azure subscription
          ansible.builtin.assert:
            that:
              - cp_azure_account.id == cp_azure_subscription_id
              - cp_azure_account.state == 'Enabled'
              - cp_azure_account.tenantId == cp_azure_tenant_id
            fail_msg: The Azure CLI is not authenticated to the approved enabled subscription.

        - name: Read the exact Azure resource group
          ansible.builtin.command:
            argv:
              - az
              - group
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --name
              - "{{ cp_azure_resource_group }}"
              - --query
              - '{name:name,location:location,provisioningState:properties.provisioningState}'
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_resource_group_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure resource group
          ansible.builtin.set_fact:
            cp_azure_resource_group_state: >-
              {{ cp_azure_resource_group_raw.stdout | from_json }}

        - name: Require the exact UAE North resource group
          ansible.builtin.assert:
            that:
              - cp_azure_resource_group_state.name | lower == cp_azure_resource_group | lower
              - cp_azure_resource_group_state.location | lower == 'uaenorth'
              - cp_azure_resource_group_state.provisioningState == 'Succeeded'
            fail_msg: The approved Azure resource group is missing or not healthy in UAE North.

        - name: Audit the exact current POC OS-disk attachments without mutation
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../../infra/azure-poc/lockdown_os_disks.py"
              - --mode
              - audit
              - --expected-subscription-id
              - "{{ cp_azure_subscription_id }}"
          environment: *azure_cli_environment
          register: cp_azure_poc_os_disk_audit_raw
          changed_when: false
          check_mode: false
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Parse the resolved POC OS-disk attachment evidence
          ansible.builtin.set_fact:
            cp_azure_poc_os_disk_audit: >-
              {{ cp_azure_poc_os_disk_audit_raw.stdout | from_json }}
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Require exactly three bounded and locked POC OS-disk attachments
          ansible.builtin.assert:
            that:
              - >-
                cp_azure_poc_os_disk_audit.keys() | list | sort ==
                ['disks', 'resourceGroup', 'status', 'subscriptionId'] | sort
              - >-
                cp_azure_poc_os_disk_audit.status ==
                'POC_OS_DISKS_AUDIT_PASSED'
              - >-
                cp_azure_poc_os_disk_audit.subscriptionId ==
                cp_azure_subscription_id
              - >-
                cp_azure_poc_os_disk_audit.resourceGroup ==
                cp_azure_resource_group
              - cp_azure_poc_os_disk_audit.disks | length == 3
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='vmName') | list ==
                ['viv-sbc-poc-cp1', 'viv-sbc-poc-sbc1',
                 'viv-sbc-poc-sbc2']
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='baseName') | list ==
                ['viv-sbc-poc-cp1-osdisk', 'viv-sbc-poc-sbc1-osdisk',
                 'viv-sbc-poc-sbc2-osdisk']
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='name') | unique | list | length == 3
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='id') | map('lower') | unique | list | length == 3
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='publicNetworkAccess') | unique | list ==
                ['Disabled']
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='networkAccessPolicy') | unique | list ==
                ['DenyAll']
              - >-
                cp_azure_poc_os_disk_audit.disks |
                map(attribute='provisioningState') | unique | list ==
                ['Succeeded']
            fail_msg: >-
              The read-only POC OS-disk audit did not prove exactly one
              original or bounded reimage-derived locked disk attached to
              each exact CP1/SBC1/SBC2 VM.
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Require each resolved OS-disk identity and ownership boundary
          ansible.builtin.assert:
            that:
              - >-
                item.keys() | list | sort ==
                ['baseName', 'id', 'managedBy', 'name',
                 'networkAccessPolicy', 'provisioningState',
                 'publicNetworkAccess', 'tags', 'vmId', 'vmName'] | sort
              - >-
                item.name == item.baseName or
                item.name is match('^' ~ item.baseName ~
                '_(?:[0-9a-f]{32})(?:_[0-9a-f]{32})*$')
              - item.managedBy | lower == item.vmId | lower
              - >-
                item.id | lower ==
                ('/subscriptions/' ~ cp_azure_subscription_id ~
                 '/resourceGroups/' ~ cp_azure_resource_group ~
                 '/providers/Microsoft.Compute/disks/' ~ item.name) | lower
              - >-
                item.vmId | lower ==
                ('/subscriptions/' ~ cp_azure_subscription_id ~
                 '/resourceGroups/' ~ cp_azure_resource_group ~
                 '/providers/Microsoft.Compute/virtualMachines/' ~
                 item.vmName) | lower
            fail_msg: >-
              A resolved POC OS disk has a malformed derived name, resource
              ID, or cross-owned VM attachment.
          loop: "{{ cp_azure_poc_os_disk_audit.disks | default([]) }}"
          loop_control:
            label: "{{ item.vmName | default('invalid-os-disk') }}"
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Read the complete top-level resource set
          ansible.builtin.command:
            argv:
              - az
              - resource
              - list
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --query
              - 'sort_by([],&name)[].{name:name,type:type,location:location}'
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_resources_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure resource set
          ansible.builtin.set_fact:
            cp_azure_resources: "{{ cp_azure_resources_raw.stdout | from_json }}"
            cp_azure_legacy_expected_resources:
              - name: "{{ cp_azure_vm_name }}"
                type: Microsoft.Compute/virtualMachines
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_os_disk_name }}"
                type: Microsoft.Compute/disks
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_nic_name }}"
                type: Microsoft.Network/networkInterfaces
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_nsg_name }}"
                type: Microsoft.Network/networkSecurityGroups
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_public_ip_name }}"
                type: Microsoft.Network/publicIPAddresses
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_vnet_name }}"
                type: Microsoft.Network/virtualNetworks
                location: "{{ cp_azure_location }}"

        - name: Require exactly the six-resource base and no managed runtime service
          ansible.builtin.assert:
            that:
              - cp_azure_resources | length == 6
              - >-
                cp_azure_resources ==
                (cp_azure_legacy_expected_resources | sort(attribute='name'))
            fail_msg: >-
              The Azure resource group is not the exact VM, disk, NIC, NSG,
              public IP, and VNet base set; an unexpected or managed runtime
              service is present.
          when: cp_azure_infrastructure_topology_selected == 'legacy-single-node'

        - name: Build the exact three-node POC resource contract
          ansible.builtin.set_fact:
            cp_azure_poc_expected_declared_resources:
              - name: "{{ cp_azure_vm_name }}"
                type: Microsoft.Compute/virtualMachines
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_nic_name }}"
                type: Microsoft.Network/networkInterfaces
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_nsg_name }}"
                type: Microsoft.Network/networkSecurityGroups
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_public_ip_name }}"
                type: Microsoft.Network/publicIPAddresses
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[0].vm_name }}"
                type: Microsoft.Compute/virtualMachines
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[0].nic_name }}"
                type: Microsoft.Network/networkInterfaces
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[0].nsg_name }}"
                type: Microsoft.Network/networkSecurityGroups
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[0].public_ip_name }}"
                type: Microsoft.Network/publicIPAddresses
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[1].vm_name }}"
                type: Microsoft.Compute/virtualMachines
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[1].nic_name }}"
                type: Microsoft.Network/networkInterfaces
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[1].nsg_name }}"
                type: Microsoft.Network/networkSecurityGroups
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_nodes[1].public_ip_name }}"
                type: Microsoft.Network/publicIPAddresses
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_vnet_name }}"
                type: Microsoft.Network/virtualNetworks
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_edge_availability_set_name }}"
                type: Microsoft.Compute/availabilitySets
                location: "{{ cp_azure_location }}"
            cp_azure_poc_expected_disk_resources:
              - name: "{{ cp_azure_poc_os_disk_audit.disks[0].name }}"
                type: Microsoft.Compute/disks
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_os_disk_audit.disks[1].name }}"
                type: Microsoft.Compute/disks
                location: "{{ cp_azure_location }}"
              - name: "{{ cp_azure_poc_os_disk_audit.disks[2].name }}"
                type: Microsoft.Compute/disks
                location: "{{ cp_azure_location }}"
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Split declared POC resources from provider-created managed disks
          ansible.builtin.set_fact:
            cp_azure_poc_declared_resources: >-
              {{ cp_azure_resources |
                 rejectattr('type', 'equalto', 'Microsoft.Compute/disks') |
                 list | sort(attribute='name') }}
            cp_azure_poc_disk_resources: >-
              {{ cp_azure_resources |
                 selectattr('type', 'equalto', 'Microsoft.Compute/disks') |
                 list | sort(attribute='name') }}
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Require exactly the fourteen-resource POC base and three managed OS disks
          ansible.builtin.assert:
            that:
              - cp_azure_poc_declared_resources | length == 14
              - cp_azure_poc_disk_resources | length == 3
              - cp_azure_resources | length == 17
              - >-
                cp_azure_poc_declared_resources ==
                (cp_azure_poc_expected_declared_resources | sort(attribute='name'))
              - >-
                cp_azure_poc_disk_resources ==
                (cp_azure_poc_expected_disk_resources | sort(attribute='name'))
              - >-
                cp_azure_resources ==
                ((cp_azure_poc_expected_declared_resources +
                  cp_azure_poc_expected_disk_resources) | sort(attribute='name'))
            fail_msg: >-
              The POC resource group is not exactly the fourteen declared
              CP1/SBC1/SBC2 resources plus their three provider-created
              managed OS disks; an expected resource is absent or an
              undeclared resource or managed service is present.
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Read the exact Azure virtual machine security and storage profile
          ansible.builtin.command:
            argv:
              - az
              - vm
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - "{{ cp_azure_vm_name }}"
              - --query
              - >-
                {id:id,name:name,location:location,vmSize:hardwareProfile.vmSize,
                availabilitySetId:availabilitySet.id,identityType:identity.type,
                securityType:securityProfile.securityType,
                secureBootEnabled:securityProfile.uefiSettings.secureBootEnabled,
                vTpmEnabled:securityProfile.uefiSettings.vTpmEnabled,
                imagePublisher:storageProfile.imageReference.publisher,
                imageOffer:storageProfile.imageReference.offer,
                imageSku:storageProfile.imageReference.sku,
                imageVersion:storageProfile.imageReference.version,
                imageExactVersion:storageProfile.imageReference.exactVersion,
                osDiskName:storageProfile.osDisk.name,
                osDiskId:storageProfile.osDisk.managedDisk.id,
                osDiskType:storageProfile.osDisk.osType,
                osDiskSizeGiB:storageProfile.osDisk.diskSizeGB,
                osDiskSku:storageProfile.osDisk.managedDisk.storageAccountType,
                osDiskCaching:storageProfile.osDisk.caching,
                osDiskDeleteOption:storageProfile.osDisk.deleteOption,
                dataDisks:storageProfile.dataDisks,
                networkInterfaces:networkProfile.networkInterfaces[].{id:id,
                primary:primary,deleteOption:deleteOption},
                provisioningState:provisioningState}
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_vm_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure virtual machine profile
          ansible.builtin.set_fact:
            cp_azure_vm: "{{ cp_azure_vm_raw.stdout | from_json }}"
            cp_azure_expected_vm_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Compute/virtualMachines/{{ cp_azure_vm_name }}
            cp_azure_expected_nic_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Network/networkInterfaces/{{ cp_azure_nic_name }}

        - name: Require the exact trusted Debian 13 Azure virtual machine
          ansible.builtin.assert:
            that:
              - cp_azure_vm.id | lower == cp_azure_expected_vm_id | lower
              - cp_azure_vm.name == cp_azure_vm_name
              - cp_azure_vm.location | lower == 'uaenorth'
              - cp_azure_vm.vmSize == cp_azure_vm_size
              - >-
                cp_azure_infrastructure_topology_selected == 'legacy-single-node' or
                cp_azure_vm.availabilitySetId is none
              - >-
                cp_azure_infrastructure_topology_selected == 'legacy-single-node' or
                cp_azure_vm.identityType == 'SystemAssigned'
              - cp_azure_vm.securityType == 'TrustedLaunch'
              - cp_azure_vm.secureBootEnabled | bool
              - cp_azure_vm.vTpmEnabled | bool
              - cp_azure_vm.imagePublisher == 'Debian'
              - cp_azure_vm.imageOffer == 'debian-13'
              - cp_azure_vm.imageSku == '13-gen2'
              - cp_azure_vm.imageVersion == cp_azure_vm_image_version
              - cp_azure_vm.imageExactVersion == cp_azure_vm_image_version
              - cp_azure_vm.osDiskName == cp_azure_os_disk_name
              - >-
                cp_azure_infrastructure_topology_selected == 'legacy-single-node' or
                cp_azure_vm.osDiskId | lower ==
                cp_azure_poc_os_disk_audit.disks[0].id | lower
              - cp_azure_vm.osDiskType == 'Linux'
              - cp_azure_vm.osDiskSizeGiB | int == cp_azure_os_disk_size_gb | int
              - cp_azure_vm.osDiskSku == cp_azure_os_disk_sku
              - cp_azure_vm.osDiskCaching == 'ReadWrite'
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_vm.osDiskDeleteOption == 'Detach') or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 cp_azure_vm.osDiskDeleteOption == 'Delete')
              - cp_azure_vm.dataDisks | length == 0
              - cp_azure_vm.networkInterfaces | length == 1
              - cp_azure_vm.networkInterfaces[0].id | lower == cp_azure_expected_nic_id | lower
              - cp_azure_vm.networkInterfaces[0].primary | bool
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_vm.networkInterfaces[0].deleteOption == 'Detach') or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 cp_azure_vm.networkInterfaces[0].deleteOption == 'Delete')
              - cp_azure_vm.provisioningState == 'Succeeded'
            fail_msg: >-
              The Azure VM does not match the exact pinned Debian 13 Gen2,
              D2as_v5, Trusted Launch, Secure Boot, vTPM, or
              topology-specific OS-disk contract.

        - name: Read the Azure virtual machine instance state
          ansible.builtin.command:
            argv:
              - az
              - vm
              - get-instance-view
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - "{{ cp_azure_vm_name }}"
              - --query
              - instanceView.statuses[].code
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_vm_instance_state_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure virtual machine instance state
          ansible.builtin.set_fact:
            cp_azure_vm_instance_states: >-
              {{ cp_azure_vm_instance_state_raw.stdout | from_json }}

        - name: Require the Azure virtual machine to be running and healthy
          ansible.builtin.assert:
            that:
              - "'ProvisioningState/succeeded' in cp_azure_vm_instance_states"
              - "'PowerState/running' in cp_azure_vm_instance_states"
            fail_msg: The exact Azure controller VM is not running and provisioned.

        - name: Read the exact managed OS disk
          ansible.builtin.command:
            argv:
              - az
              - disk
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - >-
                {{ cp_azure_poc_os_disk_audit.disks[0].name
                   if cp_azure_infrastructure_topology_selected == 'poc-three-node'
                   else cp_azure_os_disk_name }}
              - --query
              - >-
                {id:id,name:name,location:location,diskSizeGiB:diskSizeGB,sku:sku.name,
                managedBy:managedBy,securityType:securityProfile.securityType,
                encryptionType:encryption.type,publicNetworkAccess:publicNetworkAccess,
                networkAccessPolicy:networkAccessPolicy,provisioningState:provisioningState}
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_disk_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized managed OS disk
          ansible.builtin.set_fact:
            cp_azure_disk: "{{ cp_azure_disk_raw.stdout | from_json }}"

        - name: Require the exact private encrypted controller OS disk
          ansible.builtin.assert:
            that:
              - >-
                cp_azure_disk.name ==
                (cp_azure_poc_os_disk_audit.disks[0].name
                 if cp_azure_infrastructure_topology_selected == 'poc-three-node'
                 else cp_azure_os_disk_name)
              - >-
                cp_azure_infrastructure_topology_selected == 'legacy-single-node' or
                cp_azure_disk.id | lower ==
                cp_azure_poc_os_disk_audit.disks[0].id | lower
              - cp_azure_disk.location | lower == 'uaenorth'
              - cp_azure_disk.diskSizeGiB | int == cp_azure_os_disk_size_gb | int
              - cp_azure_disk.sku == cp_azure_os_disk_sku
              - cp_azure_disk.managedBy | lower == cp_azure_expected_vm_id | lower
              - cp_azure_disk.securityType == 'TrustedLaunch'
              - cp_azure_disk.encryptionType == 'EncryptionAtRestWithPlatformKey'
              - cp_azure_disk.publicNetworkAccess == 'Disabled'
              - cp_azure_disk.networkAccessPolicy == 'DenyAll'
              - cp_azure_disk.provisioningState == 'Succeeded'
            fail_msg: >-
              The Azure OS disk is not the exact topology-specific private,
              encrypted managed disk.

        - name: Read the exact static public IP
          ansible.builtin.command:
            argv:
              - az
              - network
              - public-ip
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - "{{ cp_azure_public_ip_name }}"
              - --query
              - >-
                {id:id,name:name,location:location,ipAddress:ipAddress,
                allocationMethod:publicIPAllocationMethod,ipVersion:publicIPAddressVersion,
                sku:sku.name,skuTier:sku.tier,
                idleTimeout:idleTimeoutInMinutes,
                dnsLabel:dnsSettings.domainNameLabel,dnsFqdn:dnsSettings.fqdn,
                provisioningState:provisioningState}
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_public_ip_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized static public IP
          ansible.builtin.set_fact:
            cp_azure_public_ip_state: "{{ cp_azure_public_ip_raw.stdout | from_json }}"
            cp_azure_expected_public_ip_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Network/publicIPAddresses/{{ cp_azure_public_ip_name }}

        - name: Require the exact static Standard IPv4 address
          ansible.builtin.assert:
            that:
              - cp_azure_public_ip_state.id | lower == cp_azure_expected_public_ip_id | lower
              - cp_azure_public_ip_state.name == cp_azure_public_ip_name
              - cp_azure_public_ip_state.location | lower == 'uaenorth'
              - cp_azure_public_ip_state.ipAddress == cp_azure_public_ip
              - cp_azure_public_ip_state.allocationMethod == 'Static'
              - cp_azure_public_ip_state.ipVersion == 'IPv4'
              - cp_azure_public_ip_state.sku == 'Standard'
              - cp_azure_public_ip_state.skuTier == 'Regional'
              - >-
                cp_azure_infrastructure_topology_selected == 'legacy-single-node' or
                cp_azure_public_ip_state.idleTimeout | int == 30
              - cp_azure_public_ip_state.dnsLabel == cp_azure_public_ip_dns_label
              - cp_azure_public_ip_state.dnsLabel is none
              - cp_azure_public_ip_state.dnsFqdn is none
              - cp_azure_public_ip_state.provisioningState == 'Succeeded'
            fail_msg: The controller public IP is not the declared static Standard IPv4 address.

        - name: Read the exact controller network interface
          ansible.builtin.command:
            argv:
              - az
              - network
              - nic
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - "{{ cp_azure_nic_name }}"
              - --query
              - >-
                {id:id,name:name,location:location,
                acceleratedNetworking:enableAcceleratedNetworking,
                ipForwarding:enableIPForwarding,
                nsgId:networkSecurityGroup.id,
                vmId:virtualMachine.id,
                ipConfigurations:ipConfigurations[].{id:id,name:name,primary:primary,
                privateIp:privateIPAddress,privateIpVersion:privateIPAddressVersion,
                privateIpAllocationMethod:privateIPAllocationMethod,
                publicIpId:publicIPAddress.id,subnetId:subnet.id,
                provisioningState:provisioningState},
                provisioningState:provisioningState}
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_nic_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized controller network interface
          ansible.builtin.set_fact:
            cp_azure_nic: "{{ cp_azure_nic_raw.stdout | from_json }}"
            cp_azure_expected_nsg_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Network/networkSecurityGroups/{{ cp_azure_nsg_name }}
            cp_azure_expected_subnet_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Network/virtualNetworks/{{ cp_azure_vnet_name
              }}/subnets/{{ cp_azure_subnet_name }}
            cp_azure_expected_ip_configuration_id: >-
              {{ cp_azure_expected_nic_id }}/ipConfigurations/{{
              cp_azure_nic_ip_configuration_name }}

        - name: Require the exact topology-specific non-forwarding controller NIC
          ansible.builtin.assert:
            that:
              - cp_azure_nic.id | lower == cp_azure_expected_nic_id | lower
              - cp_azure_nic.name == cp_azure_nic_name
              - cp_azure_nic.location | lower == 'uaenorth'
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_nic.acceleratedNetworking | bool) or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 not (cp_azure_nic.acceleratedNetworking | bool))
              - cp_azure_nic.ipForwarding == false
              - cp_azure_nic.nsgId | lower == cp_azure_expected_nsg_id | lower
              - cp_azure_nic.vmId | lower == cp_azure_expected_vm_id | lower
              - cp_azure_nic.ipConfigurations | length == 1
              - >-
                cp_azure_nic.ipConfigurations[0].id | lower ==
                cp_azure_expected_ip_configuration_id | lower
              - >-
                cp_azure_nic.ipConfigurations[0].name ==
                cp_azure_nic_ip_configuration_name
              - cp_azure_nic.ipConfigurations[0].primary | bool
              - cp_azure_nic.ipConfigurations[0].privateIp == cp_azure_private_ip
              - cp_azure_nic.ipConfigurations[0].privateIpVersion == 'IPv4'
              - >-
                cp_azure_nic.ipConfigurations[0].privateIpAllocationMethod ==
                cp_azure_private_ip_allocation_method
              - >-
                cp_azure_nic.ipConfigurations[0].publicIpId | lower ==
                cp_azure_expected_public_ip_id | lower
              - >-
                cp_azure_nic.ipConfigurations[0].subnetId | lower ==
                cp_azure_expected_subnet_id | lower
              - cp_azure_nic.ipConfigurations[0].provisioningState == 'Succeeded'
              - cp_azure_nic.provisioningState == 'Succeeded'
            fail_msg: The controller NIC is not bound to the exact NSG, public IP, and subnet.

        - name: Read the exact Azure virtual network and subnet topology
          ansible.builtin.command:
            argv:
              - az
              - network
              - vnet
              - show
              - --subscription
              - "{{ cp_azure_subscription_id }}"
              - --resource-group
              - "{{ cp_azure_resource_group }}"
              - --name
              - "{{ cp_azure_vnet_name }}"
              - --query
              - >-
                {id:id,name:name,location:location,
                addressPrefixes:addressSpace.addressPrefixes,
                dnsServers:dhcpOptions.dnsServers,
                ddosProtection:enableDdosProtection,
                peerings:virtualNetworkPeerings[].id,
                subnets:subnets[].{id:id,name:name,addressPrefix:addressPrefix,
                addressPrefixes:addressPrefixes,
                defaultOutboundAccess:defaultOutboundAccess,
                delegations:delegations[].id,
                ipConfigurationIds:ipConfigurations[].id,
                networkSecurityGroupId:networkSecurityGroup.id,
                natGatewayId:natGateway.id,routeTableId:routeTable.id,
                privateEndpointNetworkPolicies:privateEndpointNetworkPolicies,
                privateLinkServiceNetworkPolicies:privateLinkServiceNetworkPolicies,
                privateEndpointIds:privateEndpoints[].id,
                serviceEndpoints:serviceEndpoints[].service,
                serviceEndpointPolicyIds:serviceEndpointPolicies[].id,
                provisioningState:provisioningState},
                provisioningState:provisioningState}
              - --output
              - json
          environment: *azure_cli_environment
          register: cp_azure_vnet_raw
          changed_when: false
          check_mode: false

        - name: Parse the sanitized Azure virtual network topology
          ansible.builtin.set_fact:
            cp_azure_vnet: "{{ cp_azure_vnet_raw.stdout | from_json }}"
            cp_azure_expected_vnet_id: >-
              /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
              }}/providers/Microsoft.Network/virtualNetworks/{{ cp_azure_vnet_name }}

        - name: Select the controller Azure subnet
          ansible.builtin.set_fact:
            cp_azure_subnet: "{{ cp_azure_vnet.subnets[0] }}"

        - name: Require the exact isolated Azure virtual network and subnet
          ansible.builtin.assert:
            that:
              - cp_azure_vnet.id | lower == cp_azure_expected_vnet_id | lower
              - cp_azure_vnet.name == cp_azure_vnet_name
              - cp_azure_vnet.location | lower == 'uaenorth'
              - cp_azure_vnet.addressPrefixes == [cp_azure_vnet_address_prefix]
              - cp_azure_vnet.dnsServers | default([], true) | length == 0
              - cp_azure_vnet.ddosProtection == false
              - cp_azure_vnet.peerings | length == 0
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_vnet.subnets | length == 1) or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 cp_azure_vnet.subnets | length == 2)
              - cp_azure_vnet.provisioningState == 'Succeeded'
              - cp_azure_subnet.id | lower == cp_azure_expected_subnet_id | lower
              - cp_azure_subnet.name == cp_azure_subnet_name
              - cp_azure_subnet.addressPrefix == cp_azure_subnet_address_prefix
              - cp_azure_subnet.addressPrefixes is none
              - cp_azure_subnet.defaultOutboundAccess == false
              - cp_azure_subnet.delegations | length == 0
              - cp_azure_subnet.ipConfigurationIds | length == 1
              - >-
                cp_azure_subnet.ipConfigurationIds[0] | lower ==
                cp_azure_expected_ip_configuration_id | lower
              - cp_azure_subnet.networkSecurityGroupId is none
              - cp_azure_subnet.natGatewayId is none
              - cp_azure_subnet.routeTableId is none
              - >-
                (cp_azure_infrastructure_topology_selected == 'legacy-single-node' and
                 cp_azure_subnet.privateEndpointNetworkPolicies == 'Disabled') or
                (cp_azure_infrastructure_topology_selected == 'poc-three-node' and
                 cp_azure_subnet.privateEndpointNetworkPolicies == 'Enabled')
              - cp_azure_subnet.privateLinkServiceNetworkPolicies == 'Enabled'
              - cp_azure_subnet.privateEndpointIds | default([], true) | length == 0
              - cp_azure_subnet.serviceEndpoints | default([], true) | length == 0
              - >-
                cp_azure_subnet.serviceEndpointPolicyIds |
                default([], true) | length == 0
              - cp_azure_subnet.provisioningState == 'Succeeded'
            fail_msg: >-
              The Azure VNet or subnet differs from the exact isolated
              topology-specific address-space and policy contract.

        - name: Select the POC Edge subnet and expected NIC bindings
          ansible.builtin.set_fact:
            cp_azure_poc_edge_subnet: "{{ cp_azure_vnet.subnets[1] }}"
            cp_azure_poc_expected_edge_ip_configuration_ids:
              - >-
                /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
                }}/providers/Microsoft.Network/networkInterfaces/{{ cp_azure_poc_edge_nodes[0].nic_name
                }}/ipConfigurations/ipconfig1
              - >-
                /subscriptions/{{ cp_azure_subscription_id }}/resourceGroups/{{ cp_azure_resource_group
                }}/providers/Microsoft.Network/networkInterfaces/{{ cp_azure_poc_edge_nodes[1].nic_name
                }}/ipConfigurations/ipconfig1
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

