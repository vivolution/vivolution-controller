              - cp_azure_dns_raw.stdout is defined
              - cp_azure_dns_raw.stdout.startswith('{')
            fail_msg: The declared controller DNS A record is absent or unreadable.

        - name: Parse the sanitized public DNS A record
          ansible.builtin.set_fact:
            cp_azure_dns: "{{ cp_azure_dns_raw.stdout | from_json }}"

        - name: Require DNS to resolve only to the exact static public IP
          ansible.builtin.assert:
            that:
              - >-
                cp_azure_dns.fqdn | lower ==
                (cp_ingress_server_name | lower) ~ '.'
              - cp_azure_dns.addresses | length == 1
              - cp_azure_dns.addresses[0] == cp_azure_public_ip_state.ipAddress
              - cp_azure_dns.addresses[0] == cp_azure_public_ip
              - cp_azure_dns.ttl | int >= 60
              - cp_azure_dns.ttl | int <= 3600
              - cp_azure_dns.provisioningState == 'Succeeded'
            fail_msg: The controller DNS A record does not bind only to the static public IP.

        - name: Resolve the controller hostname through the runner resolver
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -c
              - >-
                import json, socket, sys;
                print(json.dumps(sorted({answer[4][0] for answer in
                socket.getaddrinfo(sys.argv[1], None, family=socket.AF_INET,
                type=socket.SOCK_STREAM)})))
              - "{{ cp_ingress_server_name }}"
          register: cp_azure_runner_dns_raw
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Require successful public DNS resolution from the runner
          ansible.builtin.assert:
            that:
              - cp_azure_runner_dns_raw.rc == 0
              - cp_azure_runner_dns_raw.stdout is defined
              - cp_azure_runner_dns_raw.stdout.startswith('[')
            fail_msg: The runner cannot resolve the declared controller hostname.

        - name: Parse the sanitized runner DNS result
          ansible.builtin.set_fact:
            cp_azure_runner_dns_addresses: >-
              {{ cp_azure_runner_dns_raw.stdout | from_json }}

        - name: Require public DNS to resolve solely to the static public IP
          ansible.builtin.assert:
            that:
              - cp_azure_runner_dns_addresses == [cp_azure_public_ip]
            fail_msg: >-
              Public DNS resolution from the runner differs from the exact
              static Azure public IP contract.

        - name: Reaudit the exact POC OS-disk attachments after all qualification reads
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../../infra/azure-poc/lockdown_os_disks.py"
              - --mode
              - audit
              - --expected-subscription-id
              - "{{ cp_azure_subscription_id }}"
          environment: *azure_cli_environment
          register: cp_azure_poc_os_disk_final_audit_raw
          changed_when: false
          check_mode: false
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Prove the POC OS-disk identity did not race qualification
          ansible.builtin.assert:
            that:
              - >-
                cp_azure_poc_os_disk_final_audit_raw.stdout | from_json ==
                cp_azure_poc_os_disk_audit
            fail_msg: >-
              A VM attachment, disk identity, ownership tag, or network lock
              changed during infrastructure qualification.
          when: cp_azure_infrastructure_topology_selected == 'poc-three-node'

        - name: Report sanitized Azure infrastructure qualification evidence
          ansible.builtin.debug:
            msg:
              - azure_infrastructure=passed
              - "azure_topology={{ cp_azure_infrastructure_topology_selected }}"
              - "azure_cli={{ cp_azure_cli_version }}"
              - "subscription_id={{ cp_azure_account.id }}"
              - "resource_group={{ cp_azure_resource_group_state.name }}"
              - "location={{ cp_azure_vm.location }}"
              - "vm={{ cp_azure_vm.name }}"
              - "vm_size={{ cp_azure_vm.vmSize }}"
              - security=TrustedLaunch,SecureBoot,vTPM
              - >-
                image={{ cp_azure_vm.imagePublisher }}:{{ cp_azure_vm.imageOffer }}:
                {{ cp_azure_vm.imageSku }}:{{ cp_azure_vm.imageExactVersion }}
              - >-
                os_disk={{ cp_azure_disk.name }},{{ cp_azure_disk.diskSizeGiB }}GiB,
                {{ cp_azure_disk.sku }}
              - "public_ip={{ cp_azure_public_ip_state.ipAddress }},Static,Standard"
              - >-
                resource_set={{
                'vm,disk,nic,nsg,public-ip,vnet'
                if cp_azure_infrastructure_topology_selected == 'legacy-single-node'
                else
                '14-declared-resources,3-managed-os-disks,cp1,sbc1,sbc2' }}
              - >-
                network=vnet-{{ cp_azure_vnet_address_prefix }},
                subnet-{{ cp_azure_subnet_address_prefix }},
                private-{{ cp_azure_private_ip }}
              - >-
                nsg_custom_rules={{
                'ssh-approved-ip,http-public,https-public,deny-remainder'
                if cp_azure_infrastructure_topology_selected == 'legacy-single-node'
                else
                'profile-' ~ cp_azure_poc_edge_runtime_profile ~
                ',controller-' ~
                (6 if cp_azure_poc_edge_runtime_profile == 'SYNTHETIC_PRIVATE' else 4) ~
                '-rule,edge-' ~
                (17 if cp_azure_poc_edge_runtime_profile == 'SYNTHETIC_PRIVATE' else 19) ~
                '-rule-exact-contracts' }}
              - >-
                os_disk_network_access={{
                'controller-disabled-deny-all'
                if cp_azure_infrastructure_topology_selected == 'legacy-single-node'
                else
                'cp1-sbc1-sbc2-disabled-deny-all' }}
              - >-
                edge_nodes={{
                'not-applicable'
                if cp_azure_infrastructure_topology_selected == 'legacy-single-node'
                else
                cp_azure_poc_edge_nodes | map(attribute='vm_name') | join(',') }}
              - "dns={{ cp_ingress_server_name }}->{{ cp_azure_dns.addresses[0] }}"
              - "runner_dns={{ cp_ingress_server_name }}->{{ cp_azure_runner_dns_addresses[0] }}"
